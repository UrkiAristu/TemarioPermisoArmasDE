05,06 euros.", "Multa de hasta 301,05 euros."], "c": [2], "s": "INFRACCIONES GRAVES: TIPOS Y SANCIONES." }, { "t": "¿Que implica la retirada de las armas?", "o": ["La desposesión de las mismas y la prohibición de la adquisición y tenencia de otras.", "El depósito del arma para subastarla.", "No hacer uso del arma durante un tiempo.."], "c": [0], "s": "INFRACCIONES GRAVES: TIPOS Y SANCIONES." }, { "t": "Señale la opción correcta de las siguientes propuestas:", "o": ["Es lícito llevar o usar armas en una manifestación de personas por motivos de seguridad.", "Puedo adquirir una escopeta de caza para poder defenderme en una casa de campo.", "Se considera ilícito el hecho de llevar o usar armas los concurrentes a establecimientos públicos o lugares de reunión."], "c": [2], "s": "INFRACCIONES GRAVES: TIPOS Y SANCIONES." }, { "t": "Tengo una escopeta de caza y la dedico solamente para la caza del conejo, por lo que decido recortar en mi casa la longitud de los cañones en diez centímetros para que se abra mejor el tiro, ¿puedo hacerlo?", "o": ["No", "Sí, con autorización del Delegado del Gobierno.", "Sí puedo porque diez centímetros de cañón es muy poco y no afecta al arma."], "c": [0], "s": "RETIRADA DE LAS ARMAS." }], "6": [{ "t": "¿Es cierto que el Reglamento de Armas contempla que la reparación de armas de fuego se hará solamente por industrias que las hubiesen fabricado o por armeros autorizados por la Intervención de Armas de la Guardia Civil, con establecimientos abiertos e inscritos en un registro de la citada Intervención?", "o": ["Cierto.", "Falso.", "Es indiferente."], "c": [0], "s": "REPARACIÓN DE ARMAS.-REPARACIÓN DE ARMAS." }, { "t": "¿ Qué documento será aportado al armero, cuando se le entregue un arma de fuego para reparación?", "o": ["La Licencia o Autorización de armas.", "La Guía de Pertenencia o la Guía de Circulación en su caso.", "La Guía de Pertenencia y la Licencia de Armas."], "c": [1], "s": "REPARACIÓN DE ARMAS.-REPARACIÓN DE ARMAS." }, { "t": "¿Qué destino se le dará a la Guía de pertenencia de un arma de fuego que ha sido reparada?", "o": ["Se devolverá al propietario del arma", "Se hará una nueva guía haciendo constar que ha sido reparada", "Se destruirá"], "c": [0], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Puede llevar un arma de fuego personalmente el titular de la misma para su reparación?", "o": ["No", "Algunas veces", "Sí"], "c": [2], "s": "DEPOSITO DE ARMAS..." }, { "t": "Cuando el arma a reparar proceda de una localidad distinta a la de ubicación del establecimiento del armero y no la lleva personalmente su propietario. ¿Qué documento deberá sustituir a la Guía de Pertenencia?:", "o": ["Tan solo una nota con las deficiencias que tiene el arma, si se manda por una agencia de transportes.", "Una guía de circulación expedida por la Intervención de Armas de origen o demarcación del propietario del arma.", "Si la lleva personalmente el propietario, necesita igualmente guía de circulación."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿ Que requisito será imprescindible para poder reparar armas de fuego?:", "o": ["Ser un técnico en la reparación de armas y realizarlo de forma habitual..", "Tener la condición de armero y establecimiento abierto e inscrito en un registro que llevará la Intervención de Armas de su residencia.", "Ser titular de una armería debidamente autorizada por la Autoridad Gubernativa."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Es imprescindible obtener la condición de armero para dedicarse a la reparación de armas de fuego?", "o": ["Algunas veces", "Sí", "Cuando se trate de armas blancas sí es necesario"], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Las industrias que fabrican armas de fuego están autorizadas a reparar las mismas?", "o": ["No, si la avería es muy grave", "Sí", "Depende del tipo de arma."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Se admitirá un arma de fuego para su reparación si no lleva la Guía de pertenencia?", "o": ["Sí, cuando esté en muy mal estado", "No, en ningún caso.", "Sí, siempre que dicho documento se haya sustituido por una guía de circulación..."], "c": [2], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Puede el titular de un arma de fuego llevarla personalmente a un establecimiento autorizado para su reparación?", "o": ["No", "Sí, si va acompañada de la Guía de Pertenencia.", "Sí, si va acompañada de la Guía de Pertenencia y Licencia correspondiente."], "c": [2], "s": "DEPOSITO DE ARMAS..." }, { "t": "La reparación de armas se hará solamente:", "o": ["Por las industrias que las hubiesen fabricado.", "Por armeros, que autorizados por la Intervención de Armas cuenten con establecimiento abierto al público y estén inscritos en el correspondiente registro.", "Las dos respuestas anteriores (A y B) son válidas."], "c": [2], "s": "DEPOSITO DE ARMAS..." }, { "t": "No se admitirá un arma a reparar si no va acompañada de:", "o": ["Guía de Pertenencia.", "Guía de Circulación.", "La A) y la B) son correctas."], "c": [2], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Dónde quedará la Guía de Pertenencia del arma que se esté reparando?:.", "o": ["Será devuelta al propietario del arma una vez se tomen los datos del arma por el armero.", "Quedará en poder del armero mientras dure la reparación del arma.", "No es necesario, en este caso, que el arma vaya acompañada por la Guía de Pertenencia."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Cuándo deberá ser entregada a su titular la guía de pertenencia de un arma llevada a reparar a una armería?", "o": ["Una vez presentada el arma en la armería.", "Una vez que el Armero ha tomado nota de la misma.", "En el momento de retirar el arma de la armería."], "c": [2], "s": "DEPOSITO DE ARMAS..." }, { "t": "Además del arma, ¿qué entregará al armero el titular que le deje su arma para reparar?:", "o": ["La Guía de Pertenencia.", "La licencia de armas.", "No es preciso que le entregue nada."], "c": [0], "s": "DEPOSITO DE ARMAS..." }, { "t": "Sin conocimiento de la Intervención de Armas y Explosivos de la Guardia Civil ¿en qué casos está permitida la reparación que suponga modificación de las características, estructura o calibre de un arma de caza?", "o": ["En cualquier caso..", "En ningún caso.", "Es indiferente."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Puede llevarse a cabo una reparación que suponga modificación del calibre de un arma?:", "o": ["Sí, si es de caza y esté aprobado por un banco oficial de pruebas y notificado a la Intervención de Armas.", "Sí, siempre que las variaciones hayan sido realizadas por los propios fabricantes del arma y hayan entregado esta documentación técnica en la Intervención de Armas de la demarcación del establecimiento.", "Son correctas las dos respuestas anteriores."], "c": [2], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿En qué casos se permitirá que la reparación del arma suponga la modificación sustancial de sus características?", "o": ["Con conocimiento del Ministerio de Cultura", "Con conocimiento de la Intervención de Armas y aprobación en su caso del Ministerio de Defensa o del Banco Oficial de Pruebas.", "Con conocimiento de la Intervención de Armas y Ministerio de Hacienda."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Para modificar el calibre de un arma es preciso la aprobación en su caso del Ministerio de Defensa?", "o": ["Sí, siempre que se trate de armas de la 1ª y 2ª categoría..", "Sí, siempre que se trate de armas de guerra.", "Las dos respuestas son correctas."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Puede cambiarse la estructura de un arma?.", "o": ["Sí, siempre que lo haga un armero autorizado y por un motivo razonado.", "Sí, previo conocimiento de la Intervención de Armas de la Guardia Civil y aprobación en su caso del Ministerio de Defensa o de un Banco Oficial de Pruebas según el arma de que se trate.", "En ningún caso."], "c": [1], "s": "DEPOSITO DE ARMAS..." }, { "t": "¿Puede repararse un arma de caza, de tal forma que suponga una modificación sustancial de la misma?", "o": ["Sí, con conocimiento y aprobación de los organismos competentes.", "Nunca.", "Solo en caso de que la reparación fuera efectuada por un herrero..-"], "c": [0], "s": "DEPOSITO DE ARMAS..." }, { "t": "Los fabricantes y comerciantes autorizados y sus representantes, ¿a quienes podrán dejar a prueba las armas de fuego?", "o": ["A personas mayores de edad.", "A personas que posean la correspondiente licencia.", "A personas interesadas en la compra de las armas."], "c": [1], "s": "PRUEBA DE ARMAS." }, { "t": "¿Quiénes podrán dejar a prueba las armas de fuego?", "o": ["Los fabricantes y comerciantes autorizados", "Los representantes de los fabricantes y comerciantes autorizados.", "Las dos anteriores son correctas."], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "Los comerciantes autorizados, ¿dejarán a probar un arma de fuego una persona sin Licencia de Armas?", "o": ["Sí", "No deben.", "Sí, con autorización del Armero"], "c": [1], "s": "PRUEBA DE ARMAS." }, { "t": "¿Qué plazo de validez tendrá el documento expedido por un comerciante autorizado para probar un arma de fuego en localidad distinta a la del interesado en comprarla?.", "o": ["20 días", "10 días", "1 día"], "c": [1], "s": "PRUEBA DE ARMAS." }, { "t": "¿Qué plazo de validez tendrá el documento expedido por un comerciante autorizado para probar un arma de fuego en la misma localidad de residencia del interesado en comprarla?", "o": ["24 horas", "5 días", "7 días"], "c": [1], "s": "PRUEBA DE ARMAS." }, { "t": "En el documento que expida un fabricante a favor de la persona que esté interesada en adquirir un arma de fuego, ¿podrá omitir el lugar donde se va a efectuar la prueba con dicha arma?", "o": ["-Siempre", "No", "No tiene importancia"], "c": [1], "s": "PRUEBA DE ARMAS." }, { "t": "¿Cualquier titular de la licencia de armas correspondiente y en vigor, podrá probar las armas de fuego que desea adquirir?", "o": ["Sí", "Nunca.", "Con autorización del Subdelegado del Gobierno"], "c": [0], "s": "PRUEBA DE ARMAS." }, { "t": "La persona interesada en comprar un arma, ¿puede probarla antes de adquirirla en galería autorizada?", "o": ["No, en ningún caso.", "Sí, pero debe probarla tan solo el viajante.", "Sí."], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "Una persona que posee licencia de armas correspondiente, ¿puede probar un arma de caza?", "o": ["Si, en caso de que se la deje un comerciante autorizado.", "Solo en caso de que sea titular de una licencia de caza.", "Las dos anteriores son correctas."], "c": [0], "s": "PRUEBA DE ARMAS." }, { "t": "¿Qué será indispensable, para que una persona interesada en adquirir un arma pueda probarla?:", "o": ["Que le acompañe el comercial o fabricante.", "Que tenga una autorización del vendedor..", "Estar en posesión de la correspondiente licencia."], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "¿Qué datos deberá contener el documento, de carácter personal e intransferible, que emite el fabricante, comerciante o sus representantes a la persona que vaya a realizar la prueba de un arma de fuego interesada en adquirirla?:", "o": ["Denominación expresa del lugar en donde se deben realizar las pruebas.", "Reseña del arma, la licencia y el lugar de las pruebas, plazos de validez y estar visado por la Intervención de Armas.", "Que se reseñe un plazo de tres días para realizar la prueba."], "c": [1], "s": "PRUEBA DE ARMAS." }, { "t": "¿Qué carácter tiene el documento que el fabricante o comerciante expide a favor de la persona interesada en adquirir un arma de fuego que quiere probar?", "o": ["Genérico, para cualquier posible adquirente.", "Transferible a un tercer posible adquirente, siempre que posea licencia de armas.", "Personal e intransferible."], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "Un fabricante autorizado ha dejado en prueba un arma a un particular que desea adquirirla y que posee la licencia correspondiente, ¿qué le debe expedir el fabricante?", "o": ["La guía de pertenencia.", "La factura del arma..", "Un documento de carácter personal e intransferible visado por la Intervención de Armas y Explosivos."], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "¿Por quién será visado el documento de autorización para la prueba de un arma de fuego expedido a favor de un particular por un fabricante autorizado?", "o": ["Intervención de Armas.", "Comerciante.", "No es necesario este requisito."], "c": [0], "s": "PRUEBA DE ARMAS." }, { "t": "El documento de autorización para la prueba de un arma de fuego, a favor de la persona interesada en adquirirla, ¿en qué modelo de documento se formalizará?", "o": ["En triplicado ejemplar.", "Por escrito.", "Conforme a un modelo oficial."], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "¿ Dónde se podrán probar las armas de fuego, además de en los campos de las Federaciones deportivas o en los polígonos, campos o galerías de tiro?", "o": ["En los terrenos privados.", "En los terrenos que cuenten con autorización de la autoridad local..", "En los terrenos cinegéticos controlados."], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "¿Se podrán probar las armas de fuego en Galerías de Tiro?", "o": ["No", "No, si no se tiene autorización del Alcalde", "Sí"], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "¿Se podrá probar un arma de fuego en la vía pública?", "o": ["Solo en caso de que no haya personas en la misma.", "Si es de noche y en descampado.", "Nunca"], "c": [2], "s": "PRUEBA DE ARMAS." }, { "t": "Con motivo del fallecimiento de una persona que posea armas de fuego, los herederos o albaceas, ¿cuándo deberán depositar las armas en la Intervención de Armas?", "o": ["Al día siguiente del fallecimiento.", "Tan pronto como tengan conocimiento de la obligación de hacerlo y en cualquier caso dentro de los 6 meses siguientes al fallecimiento.", "Será determinado por el Interventor de Armas y Explosivos de la residencia del fallecido..."], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Es cierto que el Reglamento de Armas dispone que al cesar en la habilitación para la tenencia legal de las armas, el interesado, deberá depositarlas inmediatamente?", "o": ["Cierto.", "Falso.", "Solo en caso de armas de caza."], "c": [0], "s": "DEPOSITO DE ARMAS." }, { "t": "Al cesar en la habilitación para la tenencia legal de las armas ¿En qué momento el interesado deberá depositar las armas con las correspondientes guías de pertenencia?", "o": ["Dentro del plazo de 10 días desde que cesó en dicha habilitación.", "Inmediatamente.", "Quedará exento del depósito si comunica tal vicisitud a la Intervención de Armas y adopta las suficientes medidas de seguridad para evitar su pérdida o sustracción."], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "No pasar dos revistas consecutivas de un arma será motivo de retirada de la guía de pertenencia ¿qué debe hacerse con el arma?", "o": ["Guardarla con las suficientes medidas de seguridad.", "Depositarla.", "Llevar la guía de pertenencia a la Intervención de Armas..."], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "¿ Qué tiempo permanecerán las armas que se depositen en las Intervenciones de Armas a disposición de los herederos, como consecuencia del fallecimiento de sus titulares?", "o": ["6 meses.", "1 año.", "2 años."], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "¿ Qué documento acompañará a las armas que se depositen en las Intervenciones de Armas, como consecuencia del fallecimiento de sus titulares?", "o": ["La Licencia de armas del fallecido y el certificado de defunción.", "La guía de pertenencia.", "La guía de pertenencia, acompañada de certificado de defunción."], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "En caso de caducidad de la licencia de armas, ¿qué tiempo tendrá para depositarlas?", "o": ["3 meses", "1 año", "Inmediatamente.."], "c": [2], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Qué documentos acompañarán a las armas de fuego que vayan a ser depositadas?", "o": ["Las Guías de Pertenencia", "La Licencia de Armas", "Las Tarjetas de Armas"], "c": [0], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Qué deberá depositar el titular de armas de fuego que extraviase la licencia de armas?", "o": ["Las Armas y las Guías de Pertenencia", "Las Guías", "No depositará ningún arma"], "c": [0], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Qué deberá depositar el titular de armas de fuego que extraviase las Guías de Pertenencia?", "o": ["La Licencia de Armas", "Las Armas que amparan dichas Guías", "Licencia de caza"], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Es cierto que el titular de un arma de fuego no puede depositarla en la Intervención de Armas y Explosivos para ser subastada?", "o": ["Cierto..", "Falso.", "Depende de si el arma es de caza o no."], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Puede el titular de un arma de fuego depositarla en la Intervención de Armas y Explosivos para ser subastada?", "o": ["No", "A veces", "Sí"], "c": [2], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Puede el titular de un arma de fuego depositarla en la Intervención de Armas y Explosivos para su reducción a chatarra?", "o": ["No; el destino reglamentario de reducción a chatarra es solo en caso de armas depositadas que carezcan de punzones necesarios o sean prohibidas.", "A veces", "Sí"], "c": [2], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Cuándo procede el depósito de las armas y la retirada y anulación de la guía de pertenencia?", "o": ["Al no pasar la revista, en una ocasión.", "Al no pasar dos revistas consecutivas.", "En ningún caso procede el depósito de las armas..."], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "En caso de fallecimiento del titular de un arma, ¿qué deberán hacer los familiares con las armas del fallecido ?", "o": ["Pueden hacer uso de las mismas sin ningún requisito previo.", "Depositarlas en la Intervención de Armas", "Pasarán a propiedad del hijo mayor de la familia"], "c": [1], "s": "DEPOSITO DE ARMAS." }, { "t": "¿Qué plazo tienen los herederos de un arma, depositada en la Intervención de Armas y Explosivos por fallecimiento del titular,   <script>

        }).join('')

      function go(id) { location.hash === '#/' + id ? route() : location.hash = '#/' + id }

      function markIn(el, term) {

      }
      function theory(v, p) {

        v.onclick = e => {

      }
      function onScroll() {

        if (cur && cur.k === 'th' && r > .93 && !S.read[cur.id]) { S.read[cur.id] = 1; save(); buildSide(); const b = $('#rd'); if (b) b.textContent = '✓ Leído' }
      }
      function quizPage(v, list, o) {

        const filt = () => { L = list.filter(q => f === 'all' || (f === 'new' && !ansOf(q)) || (f === 'bad' && S.ans[q.id] && !S.ans[q.id].ok) || (f === 'fav' && S.fav[q.id])); if (i >= L.length) i = Math.max(0, L.length - 1) };
        if (JUMP && JUMP.q) { const k = list.findIndex(q => q.id === JUMP.q); if (k >= 0) i = k; JUMP = null }
        const perm = q => { if (!q._p || q._s !== S.shuffle) { q._p = q.o.map((_, k) => k); if (S.shuffle) q._p.sort(() => Math.random() - .5); q._s = S.shuffle } return q._p };
        const left = () => o.secs - Math.floor((Date.now() - t0) / 1000);
        function draw() {
          const head = `<h1 class="pt">${esc(o.title)}</h1><div class="qh">` + (ex ? `<b>⏱ <span id="tm">${fmt(left())}</span></b><button class="btn" data-a="end">Entregar examen</button>`
            : `<select id="flt">${[['all', 'Todas'], ['new', 'Sin responder'], ['bad', 'Falladas'], ['fav', 'Favoritas']].map(([k, t]) => `<option value="${k}" ${f === k ? 'selected' : ''}>${t}</option>`).join('')}</select><label><input type="checkbox" id="shf" ${S.shuffle ? 'checked' : ''}> Barajar respuestas</label>`) + `<span>${L.length ? i + 1 : 0} / ${L.length}</span></div>`;
          if (!L.length) { v.innerHTML = head + '<p class="empty">No hay preguntas con este filtro.</p>'; return }

            (lock ? `<div class="fb ${a.ok ? 'ok' : 'ko'}">${a.ok ? '✓ ¡Correcto!' : '✗ Incorrecto'} — Correcta: <b>${esc(q.c.map(k => 'ABC'[P.indexOf(k)]).join('/'))}</b><button class="btn" data-a="find">🔎 Buscar en la teoría</button></div>` : '') +
            (!k0 ? '<div class="fb">ℹ️ Esta pregunta no tiene respuesta marcada en el temario original.</div>' : '') +

        }
        function pick(k) { const q = L[i]; if (ex) { sel[q.id] = k; draw(); return } if (ansOf(q) || !keyed(q)) return; const r = { a: k, ok: q.c.includes(k) }; S.ans[q.id] = r; if (o.retry) done[q.id] = r; save(); buildSide(); draw() }
        const nav = d => { const j = i + d; if (j >= 0 && j < L.length) { i = j; draw(); scrollTo(0, 0) } };
        const fav = () => { const id = L[i].id; S.fav[id] ? delete S.fav[id] : S.fav[id] = 1; save(); draw() };
        function finish() {
          ended = true; clearInterval(TIMER); KB = null; let ok = 0;
          list.forEach(q => { const h = q.id in sel, g = h && q.c.includes(sel[q.id]); if (g) ok++; S.ans[q.id] = { a: h ? sel[q.id] : -1, ok: g } });
          const need = Math.ceil(list.length * .8), bad = list.filter(q => !S.ans[q.id].ok); S.exams.push({ d: Date.now(), ok, n: list.length }); save(); buildSide();

        const rd = PAGES.filter(p => p.k === 'th' && S.read[p.id]).length, nt = PAGES.filter(p => p.k === 'th').length;
        v.innerHTML = `<h1 class="pt">Mi progreso</h1><div class="card"><p>📖 Teoría leída: <b>${rd}/${nt}</b> secciones · ★ Favoritas: <b>${Object.keys(S.fav).length}</b></p><table><tr><th></th><th>Respondidas</th><th>Aciertos</th><th>Cobertura</th></tr>${[1, 2, 3, 4, 5, 6].map(row).join('')}</table></div>
 <div class="card"><h3>Simulacros</h3>${S.exams.length ? `<table>${S.exams.slice().reverse().map(e => `<tr><td>${new Date(e.d).toLocaleString()}</td><td>${e.ok}/${e.n}</td><td>${e.ok >= Math.ceil(e.n * .8) ? '✅ Apto' : '❌ No apto'}</td></tr>`).join('')}</table>` : '<p class="empty">Aún no has hecho ningún simulacro.</p>'}</div>
 <div class="ft"><button class="btn" id="ex">⬇ Exportar progreso</button><label class="btn">⬆ Importar<input type="file" id="im" accept=".json" hidden></label><button class="btn" id="rs">🗑 Borrar progreso</button></div>`;
        $('#ex').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'progreso-armas.json'; a.click() };
        $('#im').onchange = e => { const r = new FileReader(); r.onload = () => { try { S = Object.assign(S, JSON.parse(r.result)); save(); route() } catch (x) { alert('Archivo no válido') } }; r.readAsText(e.target.files[0]) };
        $('#rs').onclick = () => { if (confirm('¿Borrar todo tu progreso?')) { S.read = {}; S.ans = {}; S.fav = {}; S.exams = []; save(); route() } }
      }
      let IDX;
      function index() {
        IDX = []; PAGES.filter(p => p.k === 'th').forEach(p => ST.querySelectorAll('#s-' + p.id + ' p').forEach((el, k) => { const t = el.textContent.replace(/\s+/g, ' ').trim(); if (t.length > 12) IDX.push({ p: p.id, k, t, l: norm(t) }) }));
        ALL.forEach(q => { const t = q.t + ' → ' + (q.c.length ? q.o[q.c[0]] : ''); IDX.push({ p: 'q' + q.n, q: q.id, t, l: norm(q.t + ' ' + q.o.join(' ')) }) })
      }
      function doSearch() {
        const s = $('#q').value.trim(), R = $('#sr'); if (s.length < 3) { R.style.display = 'none'; return } if (!IDX) index();
        const n = norm(s), res = []; for (const x of IDX) { const m = x.l.indexOf(n); if (m >= 0) { res.push([x, m]); if (res.length >= 40) break } }
        R.innerHTML = res.length ? res.map(([x, m], j) => { const a = Math.max(0, m - 40); return `<a data-j="${j}"><small>${x.q ? '✍️ Pregunta · ' : '📖 '}${esc(pageOf(x.p).t)}</small>${a ? '…' : ''}${esc(x.t.slice(a, m))}<mark>${esc(x.t.slice(m, m + s.length))}</mark>${esc(x.t.slice(m + s.length, m + s.length + 90))}</a>` }).join('') : '<a>Sin resultados</a>';
        R.style.display = 'block'; R._r = res; R._s = s
      }
      function search(t) { const q = $('#q'); q.value = t; doSearch(); q.focus() }
      $('#sr').onclick = e => { const a = e.target.closest('[data-j]'); if (!a) return; const [x] = $('#sr')._r[+a.dataset.j]; JUMP = x.q ? { q: x.q } : { k: x.k, term: $('#sr')._s }; $('#sr').style.display = 'none'; go(x.p) };
      let tm; $('#q').oninput = () => { clearTimeout(tm); tm = setTimeout(doSearch, 180) };
      document.addEventListener('click', e => { if (!e.target.closest('#sw')) $('#sr').style.display = 'none' });
      document.addEventListener('keydown', e => {
        const inp = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
        if (e.key === '/' && !inp) { e.preventDefault(); $('#q').focus() } else if (e.key === 'Escape') { $('#sr').style.display = 'none'; $('#lb').style.display = 'none'; document.activeElement.blur() }
        else if (!inp && !e.ctrlKey && !e.metaKey && !e.altKey && KB) KB(e)
      });
      const applyPrefs = () => { document.body.dataset.theme = S.theme; document.documentElement.style.setProperty('--fs', S.fs + 'px'); document.body.classList.toggle('recall', !!S.recall); $('#rc').style.background = S.recall ? 'var(--ac)' : '' };
      $('#th').onclick = () => { S.theme = { dark: 'light', light: 'sepia', sepia: 'dark' }[S.theme]; save(); applyPrefs() };
      $('#fa').onclick = () => { S.fs = Math.max(13, S.fs - 1); save(); applyPrefs() }; $('#fb').onclick = () => { S.fs = Math.min(30, S.fs + 1); save(); applyPrefs() };
      $('#rc').onclick = () => { S.recall = !S.recall; save(); applyPrefs() };
      $('#fm').onclick = () => document.body.classList.toggle('focus'); $('#bg').onclick = () => document.body.classList.toggle('open'); $('#pr').onclick = () => print();
      $('#lb').onclick = () => $('#lb').style.display = 'none';
      addEventListener('scroll', onScroll, { passive: true }); addEventListener('hashchange', () => { if (!JUMP) route(); else route() });
      applyPrefs(); route();
    })();
  </script>
</body>
