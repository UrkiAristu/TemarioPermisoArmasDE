<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Temario Permiso de Armas · D / E / AEM</title>
  <style>
    :root {
      --fs: 18px;
      --bg: #121816;
      --bg2: #1a2421;
      --card: #18221f;
      --tx: #E0DDC8;
      --mut: #9aa59a;
      --ac: #BC8A5F;
      --ok: #2ecc71;
      --ko: #e74c3c;
      --bd: #2a3834;
      --sw: 300px
    }

    [data-theme=light] {
      --bg: #f6f3ea;
      --bg2: #ffffff;
      --card: #ffffff;
      --tx: #23261f;
      --mut: #6b705f;
      --ac: #8a5a2b;
      --bd: #d9d3c2;
      --ok: #1b8f4c;
      --ko: #c0392b
    }

    [data-theme=sepia] {
      --bg: #f1e4c8;
      --bg2: #e8d8b4;
      --card: #f7ecd3;
      --tx: #3b2f1e;
      --mut: #7a6648;
      --ac: #8a4b1c;
      --bd: #d4bf92;
      --ok: #2f7d32;
      --ko: #b03a2e
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 'Segoe UI', system-ui, sans-serif
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    header {
      position: fixed;
      inset: 0 0 auto 0;
      height: 56px;
      background: var(--bg2);
      border-bottom: 1px solid var(--ac);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      z-index: 50
    }

    header h1 {
      font-size: 1rem;
      margin: 0;
      color: var(--ac);
      white-space: nowrap
    }

    .ib {
      background: none;
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer
    }

    .ib:hover,
    .btn:hover {
      border-color: var(--ac)
    }

    #sw {
      position: relative;
      flex: 1;
      max-width: 460px;
      margin-left: auto
    }

    #q {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--bd);
      background: var(--bg)
    }

    #sr {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      max-height: 70vh;
      overflow: auto;
      background: var(--bg2);
      border: 1px solid var(--ac);
      border-radius: 8px;
      display: none;
      box-shadow: 0 8px 30px #0008
    }

    #sr a {
      display: block;
      padding: 8px 12px;
      border-bottom: 1px solid var(--bd);
      color: var(--tx);
      text-decoration: none;
      font-size: .85rem;
      cursor: pointer
    }

    #sr a:hover {
      background: var(--bg)
    }

    #sr small {
      color: var(--ac);
      display: block
    }

    #bar {
      position: fixed;
      top: 56px;
      left: 0;
      height: 3px;
      width: 0;
      background: var(--ac);
      z-index: 60
    }

    aside {
      position: fixed;
      top: 56px;
      bottom: 0;
      left: 0;
      width: var(--sw);
      background: var(--bg2);
      border-right: 1px solid var(--bd);
      overflow: auto;
      padding: 10px;
      z-index: 40;
      transition: transform .25s
    }

    aside a {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--tx);
      text-decoration: none;
      font-size: .88rem
    }

    aside a.qz {
      margin-left: 18px;
      color: var(--mut)
    }

    aside a:hover {
      background: var(--bg)
    }

    aside a.on {
      background: var(--ac);
      color: #121816;
      font-weight: 600
    }

    aside i {
      font-style: normal;
      font-size: .75rem;
      opacity: .85;
      white-space: nowrap
    }

    aside hr {
      border: 0;
      border-top: 1px solid var(--bd);
      margin: 8px 0
    }

    main {
      margin: 56px 0 0 var(--sw);
      padding: 28px 22px 60px;
      min-height: 100vh
    }

    #view {
      max-width: 860px;
      margin: 0 auto
    }

    body.focus aside {
      transform: translateX(-100%)
    }

    body.focus main {
      margin-left: 0
    }

    @media(min-width:961px) {
      body.open aside {
        transform: translateX(-100%)
      }

      body.open main {
        margin-left: 0
      }
    }

    @media(max-width:960px) {
      main {
        margin-left: 0
      }

      aside {
        transform: translateX(-100%)
      }

      body.open aside {
        transform: none
      }
    }

    .pt {
      color: var(--ac);
      border-bottom: 2px solid var(--ac);
      padding-bottom: 6px;
      font-size: 1.5rem
    }

    .th {
      font: var(--fs)/1.8 Merriweather, Georgia, serif
    }

    .th p {
      margin: 0 0 1.1em
    }

    .th p.blank {
      display: none
    }

    .th b,
    .th strong {
      color: var(--ac);
      font-family: 'Segoe UI', sans-serif
    }

    .th p.hd {
      border-bottom: 1px solid var(--bd);
      margin-top: 1.8em;
      scroll-margin-top: 70px
    }

    .th img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 16px auto;
      border: 2px solid var(--ac);
      border-radius: 4px;
      cursor: zoom-in;
      background: #fff1
    }

    .flash {
      animation: fl 2.2s
    }

    @keyframes fl {

      0%,
      60% {
        background: #bc8a5f55
      }

      100% {
        background: none
      }
    }

    mark {
      background: #e5b84f;
      color: #111;
      border-radius: 3px;
      padding: 0 2px
    }

    .recall .th u:not(.show) {
      filter: blur(7px);
      cursor: pointer;
      user-select: none
    }

    #toc details {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 20px;
      font-family: 'Segoe UI', sans-serif
    }

    #toc summary {
      cursor: pointer;
      color: var(--ac);
      font-weight: 600
    }

    #toc a {
      display: block;
      padding: 3px 0;
      color: var(--tx);
      text-decoration: none;
      font-size: .88rem
    }

    #toc a:hover {
      color: var(--ac)
    }

    .btn {
      display: inline-block;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      text-decoration: none;
      color: var(--tx)
    }

    .btn.pri {
      background: var(--ac);
      border-color: var(--ac);
      color: #121816;
      font-weight: 700
    }

    .ft {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 30px 0
    }

    .pager {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      max-width: 860px;
      margin: 30px auto 0
    }

    .pager a {
      flex: 1;
      max-width: 48%;
      padding: 12px 14px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      background: var(--card);
      color: var(--tx);
      text-decoration: none;
      font-size: .85rem
    }

    .pager a:hover {
      border-color: var(--ac)
    }

    .pager a:last-child {
      text-align: right;
      margin-left: auto
    }

    .pager small {
      display: block;
      color: var(--mut)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0
    }

    .qh {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      font-size: .9rem;
      color: var(--mut)
    }

    .qh select,
    .qh label {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 5px 8px
    }

    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 10px 0 18px
    }

    .dot {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--bd);
      background: var(--card);
      cursor: pointer;
      font-size: .75rem
    }

    .dot.ok {
      background: #1e3a2f;
      border-color: var(--ok)
    }

    .dot.ko {
      background: #3a1e1e;
      border-color: var(--ko)
    }

    .dot.sel {
      background: var(--ac);
      color: #111
    }

    .dot.cur {
      outline: 2px solid var(--ac);
      outline-offset: 1px
    }

    .sub {
      color: var(--ac);
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px
    }

    .qc h3 {
      margin: .2em 0 1em;
      font-size: 1.15rem;
      line-height: 1.5
    }

    .opt {
      display: flex;
      gap: 12px;
      width: 100%;
      text-align: left;
      margin: 8px 0;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 10px;
      cursor: pointer
    }

    .opt b {
      color: var(--ac);
      min-width: 1.2em
    }

    .opt:hover {
      border-color: var(--ac)
    }

    .opt.ok {
      background: #1e3a2f;
      border-color: var(--ok);
      color: var(--ok)
    }

    .opt.ko {
      background: #3a1e1e;
      border-color: var(--ko);
      color: var(--ko)
    }

    .opt.sel {
      border-color: var(--ac);
      background: #bc8a5f33
    }

    [data-theme=light] .opt.ok,
    [data-theme=sepia] .opt.ok {
      background: #d9f3e2
    }

    [data-theme=light] .opt.ko,
    [data-theme=sepia] .opt.ko {
      background: #f8dcd8
    }

    .fb {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--bd)
    }

    .fb.ok {
      border-color: var(--ok)
    }

    .fb.ko {
      border-color: var(--ko)
    }

    .fb button {
      margin-left: 8px
    }

    .qn {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-top: 16px
    }

    .res {
      text-align: center;
      padding: 26px;
      border-radius: 14px;
      border: 2px solid;
      margin: 18px 0
    }

    .res.ok {
      border-color: var(--ok)
    }

    .res.ko {
      border-color: var(--ko)
    }

    .res big {
      display: block;
      font-size: 3rem;
      font-weight: 800
    }

    .rv {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 12px 16px;
      margin: 10px 0
    }

    .rv h3 {
      margin: .3em 0;
      font-size: 1rem
    }

    .rv .ok {
      color: var(--ok)
    }

    .rv .ko {
      color: var(--ko)
    }

    .rv p {
      margin: .2em 0
    }

    .bar {
      height: 10px;
      background: var(--bd);
      border-radius: 6px;
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--ac)
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    td,
    th {
      padding: 8px;
      border-bottom: 1px solid var(--bd);
      text-align: left;
      font-size: .9rem
    }

    #lb {
      position: fixed;
      inset: 0;
      background: #000d;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: zoom-out
    }

    #lb img {
      max-width: 95%;
      max-height: 95%
    }

    .empty {
      color: var(--mut);
      text-align: center;
      padding: 30px
    }

    @media print {

      header,
      aside,
      #bar,
      .pager,
      .ft,
      #toc {
        display: none !important
      }

      main {
        margin: 0
      }

      body {
        background: #fff;
        color: #000
      }

      .th b {
        color: #000
      }
    }
  </style>
</head>

  <template id="store">
    <section id="s-intro">
      <p> <b> <span>TEMARIO OBJETO DE ESTUDIO PARA LA OBTENCIÓN DEL PERMISO DE ARMAS</span></b><span>: </span> </p>
      <p><br /> <span> </span><br /> El programa de materias que se presenta a continuación recoge los conocimientos
        suficientes
        para superar la prueba teórica para la obtención de las licencias D y E, y la Autorización Especial de armas
        para
        menores (AEM), según determina el ANEXO I de la Resolución de 19 de octubre de 1998, de la Dirección General de
        la
        Guardia Civil, así como unos breves consejos para superar la prueba práctica. </p>
      <p><br /> Hemos recogido toda la información relevante que debes conocer para, una vez la hayas estudiado, puedas
        pasar a
        practicar tus conocimientos con los test de examen que te proponemos. Esta información cumple con lo dispuesto
        en Real
        Decreto 137/1993, de 29 de enero, por el que se aprueba el actual Reglamento de Armas. </p>
      <p><br /> Te animamos pues a repasar los conceptos básicos que encontrarás a continuación y que te permitirán
        obtener de
        manera sencilla y amena los conocimientos adecuados para obtener la licencia o permiso de armas correspondiente.
      </p>
      <p><br /> <b>Información previa: </b> </p>
      <p><br /> Para obtener la citada licencia de armas obligatoria para la tenencia y uso de las armas largas rayadas
        para
        caza mayor o de escopetas y armas asimiladas, el artículo 102.2 del Reglamento de Armas, establece la exigencia
        de
        superar las pruebas de capacitación que determina el Ministerio del Interior. Estas pruebas serán las
        siguientes: </p>
      <p><br /> ·<span> </span> Conocimiento de las armas, su cuidado y conservación (prueba teórica). </p>
      <p>·<span> </span>Conocimiento del actual Reglamento de Armas (prueba teórica). </p>
      <p>·<span> </span>Habilidad para el manejo de las armas y su utilización (prueba práctica). </p>
      <p><br /> Para obtener por primera vez las licencias D o <span> </span>E, los interesados deberán superar las dos
        pruebas
        de capacitación, una teórica y una práctica, que serán evaluadas por la Guardia Civil. De igual forma los
        menores que
        deseen obtener la Autorización Especial de armas para menores (AEM) deben superar las mismas pruebas. </p>
      <p><br /> Además, las pruebas de capacitación serán aplicables a las primeras autorizaciones por parte de
        extranjeros y
        españoles, mayores de 18 años, que tengan su residencia fuera de España, para uso de armas largas rayadas y de
        escopetas y armas asimiladas tanto para la caza como concursos. Quedan exentos los que tengan su residencia en
        cualquier país de la Unión Europea y acrediten estar en posesión de licencias, expedidas en los países en que
        residan,
        que habiliten la tenencia y uso de dichas armas. </p>
      <p><br /> Quedarán exentos igualmente de realizar las pruebas quienes posean o hayan poseído licencias de armas A,
        o en su
        caso, licencias de armas D, E, o F, para las armas correspondientes. </p>
      <p><br /> Cada una de las pruebas dará lugar a la calificación de apto o no apto. Los resultados se consignarán en
        el acta
        de las pruebas de cada convocatoria redactada por el Tribunal de capacitación y se harán públicos en el lugar de
        la
        realización (Intervenciones de Armas y Explosivos de las Comandancias de la Guardia Civil). </p>
      <p><br /> La convocatoria de las pruebas de capacitación se realizará una vez confeccionado el calendario por la
        Intervención de Armas y Explosivos de la Guardia Civil de la provincia del aspirante. La fecha concreta de cada
        prueba
        será comunicada a los centros de formación de forma conjunta o, en su caso, notificada personalmente a los
        interesados, según la forma de presentación de la correspondiente solicitud. </p>
      <p><br /> <b>Prueba teórica: </b> </p>
      <p><br /> La prueba teórica versará sobre el conocimiento de las armas y el Reglamento de Armas. La evaluación
        será
        positiva si el interesado ha contestado correctamente al menos a 16 de las 20 preguntas de las que consta el
        ejercicio, con un tiempo máximo para contestar de 20 minutos. <br /> <br /> <b>Cuestionario de preguntas: </b>
      </p>
      <p><br /> Del programa de conocimientos precisos se creó un cuestionario de preguntas, con objeto de que las
        pruebas
        teóricas sean las mismas en todo el territorio nacional. De este modo se pretende que los exámenes de las
        diferentes
        Comandancias de la Guardia Civil sean similares en cuanto a su dificultad. </p>
      <p><br /> El cuestionario general tiene un total de 400 preguntas, cada una de ellas con una respuesta correcta y
        otras
        dos incorrectas. </p>
      <p><br /> Para cada prueba teórica, el Tribunal de capacitación seleccionará 20 preguntas del cuestionario
        general, en la
        proporción que a continuación se indica: </p>
      <p><br /> Del TEMA I: 4 preguntas. </p>
      <p><br /> Del TEMA II: 3 preguntas. </p>
      <p><br /> Del TEMA III: 3 preguntas. </p>
      <p><br /> Del TEMA IV: 4 preguntas. </p>
      <p><br /> Del TEMA V: 3 preguntas. </p>
      <p><br /> Del TEMA VI: 3 preguntas. </p>
      <p><br /> <b>Programa de conocimientos precisos para la superación de la prueba teórica:</b> </p>
      <p><br /> Los conocimientos precisos para obtener el apto en la prueba se encuentran estructurados en seis temas,
        que
        citamos a continuación: </p>
      <p><br /> <b>Tema 1:</b> </p>
      <p><br /> ·<span> </span> Funcionamiento de las armas. </p>
      <p>·<span> </span>Piezas fundamentales y mecanismos de disparo y seguridad. </p>
      <p>·<span> </span>Conservación y limpieza de las armas. </p>
      <p>·<span> </span>Medidas de seguridad a adoptar en la tenencia de las armas. </p>
      <p><br /> <b>Tema 2:</b> </p>
      <p><br /> ·<span> </span>Categoría de las armas según el vigente Reglamento de Armas. </p>
      <p>·<span> </span>Armas semiautomáticas, armas de repetición, armas prohibidas. </p>
      <p><br /> <b>Tema 3:</b> </p>
      <p><br /> ·<span> </span> Circulación de las armas. </p>
      <p>·<span> </span>Revista de armas. </p>
      <p>·<span> </span>Transferencia de armas. </p>
      <p><br /> <b>Tema 4:</b> </p>
      <p><br /> ·<span> </span> Documentación para la tenencia y uso de armas. </p>
      <p>·<span> </span>Condiciones generales para la obtención de licencias y Tarjeta Europea de Armas de </p>
      <p> <span> </span> Fuego. </p>
      <p>·<span> </span>Trámite de las solicitudes. </p>
      <p><br /> <b>Tema 5:</b> </p>
      <p><br /> ·<span> </span>Régimen sancionador. </p>
      <p>·<span> </span>Infracciones muy graves, graves y leves. </p>
      <p>·<span> </span>Retirada de las armas. </p>
      <p> <b> </b> </p>
      <p> <b>Tema 6:</b> </p>
      <p><br /> ·<span> </span> Reparación de armas. </p>
      <p>·<span> </span>Prueba de armas. </p>
      <p>·<span> </span>Depósito de armas. </p>
      <p><br /> <span> </span>Desarrollaremos los conceptos básicos de cada uno de los 6 temas que debes conocer, para
        que,
        previamente a realizar los test, tengas una base teórica sólida y te sea mucho más sencillo identificar cuál es
        la
        respuesta correcta de cada una de las preguntas propuestas.<br /> <br /> Comenzamos por tanto a desarrollar el
        programa de
        conocimientos precisos: </p>
    </section>
    <section id="s-t1">
      <p><span> </span><b><u><span>Tema 1:<br /> </span></u><br /> <span> </span>FUNCIONAMIENTO DE LAS ARMAS:<br />
        </b><br /> A los
        efectos del presente reglamento, en relación con las armas y su munición, se entenderá por:<br /> <br />
        <b><u>Arma
            automática</u></b>: Arma de fuego que recarga automáticamente después de cada disparo y con la que es
        posible
        efectuar varios disparos sucesivos mientras permanezca accionado el disparador. </p>
      <p><img src="./assets/img/imgE.jpg" /> </p>
      <p><b><u>Arma semiautomática</u></b><u>:</u> Arma de fuego que después de cada disparo se recarga automáticamente
        y con
        la que solo es posible efectuar un disparo al accionar el disparador cada vez. </p>
      <p><br /> <img src="./assets/img/imgF.jpg" /><img src="./assets/img/img11.jpg" /><br /> <br /> <b><u> </u></b>
      </p>
      <p><b><u> Arma de repetición </u></b><u>:</u> Arma de fuego que se recarga después de cada disparo, mediante un
        mecanismo accionado por el tirador que introduce en el cañón un cartucho colocado previamente en el depósito de
        municiones. </p>
      <p><b><u>Arma de un solo tiro</u></b>: Arma de fuego sin depósito de municiones, que se recarga antes de cada
        disparo
        mediante la introducción manual de un cartucho en la recámara o en un alojamiento especial a la entrada del
        cañón.
      </p>
      <p><img src="./assets/img/img12.jpg" /><img src="./assets/img/img13.jpg" /></p>
      <p>Además de las citadas en el párrafo anterior, existen multitud de tipos de armas no propuestas, pero no son
        objeto de
        estudio en el caso que nos ocupa.</p>
      <p><img src="./assets/img/img14.jpg" /> <br /> <br /> En cuanto a las partes o grupos principales de las armas
        amparadas con las
        Licencias de Armas “D” y “E”, deberás conocer los siguientes: </p>
      <p><br /> <b><u>Cañón:</u></b> elemento de un arma de fuego que conduce y estabiliza el proyectil. </p>
      <p><img src="./assets/img/img15.jpg" /></p>
      <p><br /> <b><u>Culata:</u></b> parte del arma que es apoyada sobre el hombro para efectuar el disparo. </p>
      <p><img src="./assets/img/img16.jpg" /></p>
      <p><b><u> </u></b></p>
      <p><b><u>Ánima:</u></b> El túnel dentro del cañón de un arma de fuego a través del cual viaja el proyectil. Se
        distinguen dos tipos: <u>lisa</u> y <u>estriada</u>. La primera se refiere a un arma de fuego que no tiene
        estrías en
        el interior del cañón. La segunda, aquella que posee estrías o surcos helicoidales en el interior del cañón. Las
        ánimas de los rifles son de este último tipo. </p>
      <p><img src="./assets/img/img17.jpg" /><img src="./assets/img/img18.jpg" /></p>
      <p><b><u>Disparador:</u></b> Pieza que protege el guardamonte.<span> </span> </p>
      <p><img src="./assets/img/img19.jpg" /></p>
      <p><b><u> </u></b></p>
      <p><b><u>Choke:</u></b> estrangulamiento de la boca de fuego del cañón de una escopeta cuya finalidad será la de
        concentrar más o menos la nube de plomos producida tras el disparo. Los rifles carecen de este tipo de chokes.
      </p>
      <p><img src="./assets/img/img1A.jpg" /><img src="./assets/img/img1B.jpg" /></p>
      <p><b><u>Extractores:</u></b><u> </u>En las escopetas superpuestas o paralelas son aquellas dos uñas que sirven
        para
        desalojar los cartuchos de la recámara. </p>
      <p><img src="./assets/img/img1C.jpg" /><img src="./assets/img/img1D.jpg" /></p>
      <p> <b><span>Conceptos a conocer de un arma semiautomática</span>:</b> </p>
      <p> <br /> <b><u>El extractor, el grapón y el percutor</u></b> son piezas que componen el cerrojo. </p>
      <p><img src="./assets/img/img1E.jpg" /><img src="./assets/img/img1F.gif" /><img src="./assets/img/img21.jpg" />
      </p>
      <p><b><u>El cierre</u></b>, es la pieza que introduce el cartucho en el interior de la recámara. </p>
      <p><img src="./assets/img/img22.gif" /></p>
      <p><br /> <b><span>Conceptos a conocer de un arma superpuesta:</span> </b> </p>
      <p><br /> <b><u>La banda intermedia ventilada que poseen algunos cañones</u></b>, tiene como función refrigerar
        los
        cañones y amortiguar el efecto de los vientos laterales. </p>
      <p><img src="./assets/img/img24.jpg" /></p>
      <p> <b><span>Cómo se cargan y descargan las armas amparadas con Licencia de Armas “E” y “D”:</span></b> </p>
      <p> <br /> Aquella escopeta preparada para disparar se dice que está “montada”, es decir: cuando el mecanismo de
        disparo y
        percusión se encuentra en disposición de funcionamiento. No debemos confundir dicho concepto con aquella que
        denominamos “alimentada”, que es aquella que dispone en el interior del mecanismo de alimentación o depósito la
        munición que vamos a disparar, aunque aún no esté preparada del todo para poder dispararse.<br /> <br /> El
        cartucho que
        va a ser disparado se aloja en la recámara, como ya hemos definido anteriormente.<br /> <br /> Para alimentar
        una escopeta
        colocaremos los cartuchos en esta recámara. Si es semiautomática, colocaremos estos en el depósito. Una vez
        realizado
        el disparo, estas armas semiautomáticas expulsan la vaina por la ventana de expulsión. </p>
      <p><br /> <b><span> </span><span>Cómo hacemos disparar estas armas:</span> </b> </p>
      <p><br /> Algunas escopetas superpuestas o yuxtapuestas (paralelas), disponen de <b><u>expulsores
            automáticos</u></b>. Son
        estos mecanismos los encargados de expulsar las vainas, automáticamente al abrir el arma, una vez realizado el
        disparo. </p>
      <p><img src="./assets/img/img25.jpg" /></p>
      <p>Para apuntar a un blanco determinado las armas cuentan con un mecanismo de puntería. El desplazamiento en
        altura del
        impacto será regulado por el <b><u>alza</u> </b>y el desplazamiento lateral por el <b><u>punto de mira</u></b>.
      </p>
      <p><img src="./assets/img/img26.jpg" /><img src="./assets/img/img27.jpg" /></p>
      <p> La pieza del mecanismo de disparo que transmite el movimiento del disparador es la <b><u>biela</u></b>. </p>
      <p><img src="./assets/img/img28.jpg" /></p>
      <p>En las escopetas semiautomáticas la expulsión de la vaina se realiza aprovechando la fuerza del retroceso para
        desplazar el cierre. </p>
      <p><br /> Algunos rifles cuentan con uno o dos orificios situados en la parte anterior del <b><u>cajón de
            mecanismos</u></b> y son los encargados de la salida de gases en caso de rotura del cartucho. </p>
      <p><img src="./assets/img/img29.jpg" /></p>
      <p> <span> </span><b>PIEZAS FUNDAMENTALES Y MECANISMOS DE DISPARO Y SEGURIDAD:</b> </p>
      <p><br /> <b>Piezas fundamentales:</b> </p>
      <p><br /> Se considerarán piezas fundamentales o componentes esenciales: </p>
      <p> <b>De armas de fuego cortas:</b> </p>
      <p><u>el armazón,</u> <u>el cerrojo o cilindro</u> y <u>el cañón;</u> </p>
      <p> <img src="./assets/img/armazon_cerrojo_y_canon.jpg" /> </p>
      <p> <b> </b> </p>
      <p> <b>De armas de fuego largas, rayadas o de ánima lisa:</b> </p>
      <p><u>la caja o cajón de los mecanismos</u>, <u>el cerrojo o báscula</u> y <u>el cañón</u>; así como los
        mecanismos de
        cierre de todas ellas. </p>
      <p><img src="./assets/img/img2C.jpg" /><img src="./assets/img/img2D.jpg" /><img src="./assets/img/img2E.jpg" />
      </p>
      <p>En cuanto al funcionamiento del mecanismo de disparo, el <u>seguro manual</u> evitará el disparo aun estando el
        arma
        montada (posición “S” del seguro en casi todas las armas superpuestas y paralelas). Si desbloqueamos el seguro
        manual
        y accionamos el gatillo, será el percutor el encargado de golpear el fulminante del cartucho realizándose por
        tanto el
        disparo. </p>
      <p><img src="./assets/img/img2F.jpg" /></p>
      <p>Una avería común si se dispara el arma en vacío puede ser la rotura de la aguja percutora. </p>
      <p><br /> Las escopetas semiautomáticas pueden tener seguro automático. </p>
      <p><br /> <b><span> </span>CONSERVACIÓN Y LIMPIEZA DE LAS ARMAS:</b> </p>
      <p><br /> El interior de los cañones de una escopeta suele limpiarse con una varilla denominada <u>baqueta</u>, en
        cuyo
        extremo podremos intercambiar diferentes útiles para eliminar los residuos que deja la pólvora en el interior de
        los
        cañones. Para ayudarnos a lubricar el interior utilizaremos aceites lubricantes de los comúnmente
        comercializados para
        tal fin. </p>
      <p><img src="./assets/img/img30.jpg" /></p>
      <p>Las partes de madera como la culata o el guardamanos pueden limpiarse con aceite de linaza u otro producto
        específico
        para mantener dicha madera nutrida y en buenas condiciones. </p>
      <p><br /> Si durante el ejercicio de la caza si se moja el arma, debemos de limpiarla y engrasarla cuanto antes
        para
        evitar que se oxide. Esta limpieza, por seguridad, la realizaremos en un lugar del domicilio donde estemos
        solos. </p>
      <p><br /> <span> </span><b>MEDIDAS DE SEGURIDAD A ADORTAR EN LA TENENCIA DE ARMAS:</b> </p>
      <p><br /> Las armas de la categoría 2ª.2 (armas largas rayadas para caza mayor) las guardaremos en el propio
        domicilio y
        en un <u>armero autorizado</u>. </p>
      <p><img src="./assets/img/img31.jpg" /></p>
      <p>También pueden guardarse por empresas especializadas en la custodia de armas,
        debidamente autorizadas por la Dirección General de la Guardia Civil. </p>
      <p>Las escopetas deberán guardarse fuera del alcance de otras personas y especialmente de los niños. </p>
      <p><br /> Las armas deberán portarse descargadas y sin alimentar. Nunca deberán dejarse en el vehículo estacionado
        en la
        vía pública hasta el día siguiente, aunque vayamos a ir de caza. </p>
      <p><br /> Las trataremos siempre como si estuviesen cargadas. Nunca apuntaremos con ellas a nadie. Caminaremos con
        ellas
        durante el ejercicio de la caza con el seguro manual accionado y con el cañón apuntando al cielo o al suelo.
      </p>
      <p><br /> Al coger o dejar un arma, siempre debe comprobarse que está descargada y si desconoces su
        funcionamiento, nunca
        debes manipularla. Es obvio decir que debes de portarla sin poner el dedo en el disparador (gatillo). </p>
      <p><br /> Al cerrar la escopeta lo harás con la boca del cañón apuntando al suelo y en caso de cruzarte con otras
        personas
        durante el ejercicio de la caza procederás a descargarla en cuanto adviertas la proximidad de ellas. </p>
      <p><br /> En el caso de los rifles de caza mayor, debemos estar seguros de visualizar la zona de impacto del
        proyectil. No
        disparando nunca hacia lugares donde pueda rebotar este (piedras, elementos metálicos, etc) ni tampoco hacia el
        horizonte (viso). </p>
      <p><br /> Con el exacto cumplimiento de las normas de seguridad en el manejo de las armas pretendemos evitar que
        se
        produzcan disparos fortuitos y por tanto causar daños irreparables. </p>
    </section>
    <section id="s-t2">
      <p> <b> <span>Tema 2:</span></b> </p>
      <p><br /> <b><span> </span>CATEGORÍA DE LAS ARMAS SEGÚN EL VIGENTE REGLAMENTO DE ARMAS:</b> </p>
      <p><br /> Se entenderá por «armas» y «armas de fuego» reglamentadas, cuya adquisición, tenencia y uso pueden ser
        autorizados o permitidos con arreglo a lo dispuesto en este Reglamento, los objetos que, teniendo en cuenta sus
        características, grado de peligrosidad y destino o utilización, se enumeran y clasifican en el presente artículo
        en
        las siguientes categorías: </p>
      <p><br /> <b><u>1.ª categoría</u></b>:<br /> <br /> Armas de fuego cortas: Comprende las <u>pistolas</u> y
        <u>revólveres</u>.
      </p>
      <p><img src="./assets/img/img32.jpg" /><img src="./assets/img/img33.jpg" /></p>
      <p> <b><u>2.ª categoría</u></b>: </p>
      <p> <span>1.<span> </span></span>Armas de fuego <u>largas para vigilancia y guardería</u>. </p>
      <p><u>2</u>. Armas de fuego <u> largas rayadas</u>: Se comprenden aquellas armas utilizables <u>para caza
          mayor</u>.
        También comprende los <u>cañones estriados adaptables a escopetas de caza</u>, con recámara para cartuchos
        metálicos,
        siempre que, en ambos supuestos, no estén clasificadas como armas de guerra. </p>
      <p><img src="./assets/img/img34.jpg" /><img src="./assets/img/img35.jpg" /></p>
      <p> <b><u>3.ª categoría:</u></b> </p>
      <p><br /> <u>1</u>. Armas de fuego <u>largas rayadas para tipo deportivo</u>, de calibre 5,6 milímetros (.22
        americano),
        de percusión anular, bien sean de un disparo, bien de repetición o semiautomáticas. </p>
      <p><img src="./assets/img/img36.jpg" /></p>
      <p><u> 2 </u>. <u>Escopetas y demás armas de fuego largas de ánima lisa</u>, o que tengan cañón con rayas para
        facilitar
        el plomeo, que los bancos de pruebas reconocidos hayan marcado con punzón de escopeta de caza, no incluidas
        entre las
        armas de guerra. </p>
      <p><img src="./assets/img/img37.jpg" /></p>
      <p><u> </u></p>
      <p><u>3.</u> Armas <u>accionadas por aire u otro gas comprimido</u>, sean lisas o rayadas, siempre que la energía
        cinética del proyectil en boca exceda de 24,2 julios. </p>
      <p><img src="./assets/img/img38.jpg" /><img src="./assets/img/img39.jpg" /></p>
      <p> <b>4.ª categoría:</b> </p>
      <p> <br /> <u>1</u>. <u>Carabinas y pistolas, de tiro semiautomático y de repetición</u>; y <u>revólveres de doble
          acción,
          accionadas por aire u otro gas comprimido</u> no asimiladas a escopetas. </p>
      <p><br /> <img src="./assets/img/img3A.jpg" /> </p>
      <p> <br /> <u> </u> </p>
      <p><u> </u></p>
      <p><u> 2. </u> <u>Carabinas y pistolas, de ánima lisa o rayada, y de un solo tiro</u>, y <u> revólveres de acción
          simple, accionadas por aire u otro gas comprimido</u> no asimiladas a escopetas. </p>
      <p><img src="./assets/img/img3B.jpg" /><img src="./assets/img/img3C.jpg" /></p>
      <p> <b> </b> </p>
      <p> <b> 5.ª categoría: </b> </p>
      <p><u>1</u>. <u>Las armas blancas</u> y en general las de hoja cortante o punzante no prohibidas. </p>
      <p> <u>2</u>. <u>Los cuchillos o machetes usados por unidades militares</u> o que sean imitación de los mismos.
      </p>
      <p><img src="./assets/img/img3D.jpg" /><img src="./assets/img/img3E.jpg" /></p>
      <p> <br /> <img src="./assets/img/img3F.jpg" /> </p>
      <p> <b> </b> </p>
      <p> <b>6.ª categoría:</b> </p>
      <p><br /> <u>1.</u> <u>Armas de fuego antiguas o históricas</u>, sus reproducciones y asimiladas, conservadas en
        museos
        autorizados por el Ministerio de Defensa, si son dependientes de cualquiera de los tres Ejércitos, y por el
        Ministerio
        del Interior, en los restantes casos. </p>
      <p><img src="./assets/img/img40.jpg" /></p>
      <p><u> </u></p>
      <p><u>2</u>. Las armas de fuego cuyo modelo o cuyo año de fabricación sean <u>anteriores al 1 de enero de
          1890,</u> y
        las reproducciones y réplicas de las mismas, a menos que puedan disparar municiones destinadas a armas de guerra
        o a
        armas prohibidas. </p>
      <p><img src="./assets/img/img41.jpg" /></p>
      <p><u>3.</u> Las <u>restante</u>s armas de fuego que se conserven por su carácter histórico o artístico, dando
        cumplimiento a lo prevenido en los artículos 107 y 108 del presente Reglamento. </p>
      <p> <br /> <br /> <u> </u> </p>
      <p><u>4.</u> En general, las armas de <u>avancarga.</u><span> </span> </p>
      <p><img src="./assets/img/img42.jpg" /></p>
      <p> <b> </b> </p>
      <p> <b>7.ª categoría:</b> </p>
      <p><br /> <u>1.</u> Armas <u>de inyección anestésica</u> capaces de lanzar proyectiles que faciliten la captura o
        control
        de animales, anestesiándolos a distancia durante algún tiempo.<span> </span> </p>
      <p><img src="./assets/img/img43.jpg" /></p>
      <p><u> </u></p>
      <p><u> 2. </u> <u>Las ballestas.</u> </p>
      <p><img src="./assets/img/img44.jpg" /></p>
      <p> <u> </u> </p>
      <p><u> 3. </u> Las armas para <u> lanzar cabos</u>. </p>
      <p><img src="./assets/img/img45.jpg" /></p>
      <p><u> </u></p>
      <p><u>4.</u> Las armas de sistema <u>«Flobert». (no utilizaban pólvora, sino fulminato de mercurio)</u> </p>
      <p><img src="./assets/img/img46.jpg" /></p>
      <p><u> </u></p>
      <p><u> 5. </u> <u>Los arcos</u>, las <u>armas para lanzar líneas de pesca</u> y los <u>fusiles de pesca
          submarina</u>
        que sirvan para disparar flechas o arpones, eficaces para la pesca y para otros fines deportivos. </p>
      <p><img src="./assets/img/img47.jpg" /><img src="./assets/img/img48.jpg" /></p>
      <p><u>6.</u> <u>Los revólveres o pistolas detonadoras</u> y las <u>pistolas lanzabengalas.</u></p>
      <p><img src="./assets/img/img49.jpg" /><img src="./assets/img/img4A.jpg" /></p>
      <p><u> </u></p>
      <p>Las ballestas, incluidas en la 7ª categoría, son armas jurídicamente asimiladas a escopetas, sin embargo, no
        sería
        correcto documentarlas con la licencia tipo “D”. Tampoco sería correcto considerar un arco como un arma de este
        tipo.
      </p>
      <p>El artículo 4 del actual reglamento de armas enumera las armas prohibidas. Los instrumentos no específicamente
        expresados y que están prohibidos serán aquellos otros especialmente peligrosos para la integridad física de las
        personas. </p>
      <p><br /> <b>En función de su longitud, podemos dividir las armas en:</b> </p>
      <p><br /> <u>Arma de fuego corta</u>: Arma de fuego cuyo cañón no exceda de 30 cm o cuya longitud total no exceda
        de 60
        cm. </p>
      <p><br /> <u>Arma de fuego larga</u>: Cualquier arma de fuego que no sea un arma de fuego corta. </p>
      <p><br /> <b><span> </span>ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS:</b> </p>
      <p><br /> Recordamos lo expuesto en el tema 1 sobre armas automáticas, semiautomáticas y de repetición para
        comprender
        adecuadamente el temario que viene a continuación: </p>
      <p><br /> <u>Arma automática</u>: Arma de fuego que recarga automáticamente después de cada disparo y con la que
        es
        posible efectuar varios disparos sucesivos mientras permanezca accionado el disparador.<br /> <br /> <u>Arma
          semiautomática</u>: Arma de fuego que después de cada disparo se recarga automáticamente y con la que solo es
        posible efectuar un disparo al accionar el disparador cada vez. </p>
      <p><br /> <u>Arma de repetición</u>: Arma de fuego que se recarga después de cada disparo, mediante un mecanismo
        accionado
        por el tirador que introduce en el cañón un cartucho colocado previamente en el depósito de municiones. </p>
      <p><br /> <b>Armas prohibidas:</b> </p>
      <p><br /> Queda prohibida la publicidad, compraventa, tenencia y uso, salvo por funcionarios especialmente
        habilitados, y
        de acuerdo con lo que dispongan las respectivas normas reglamentarias de: </p>
      <p><br /> a) Las armas semiautomáticas de las categorías 2.ª, 2 y 3.ª, 2, cuya capacidad de carga sea superior a
        cinco
        cartuchos, incluido el alojado en la recámara, o cuya culata sea plegable o eliminable. </p>
      <p><br /> b) Los «sprays» de defensa personal y todas aquellas armas que despidan gases o aerosoles, así como
        cualquier
        dispositivo que comprenda mecanismos capaces de proyectar sustancialmente estupefacientes, tóxicas o corrosivas.
      </p>
      <p>De lo dispuesto en el presente apartado se exceptúan los «sprays» de defensa personal que, en virtud de la
        correspondiente aprobación del Ministerio de Sanidad y Consumo, previo informe de la Comisión Interministerial
        Permanente de Armas y Explosivos, se consideren permitidos, en cuyo caso podrán venderse en las armerías a
        personas
        que acrediten su mayoría de edad mediante la presentación del documento nacional de identidad, pasaporte,
        autorización
        o tarjeta de residencia. </p>
      <p> c) Las defensas eléctricas, de goma, tonfas o similares. </p>
      <p><img src="./assets/img/img4B.jpg" /><img src="./assets/img/img4C.jpg" /><img
          src="./assets/img/img4D.jpg" /><img src="./assets/img/img4E.jpg" /></p>
      <p>d) Los silenciadores aplicables a armas de fuego. </p>
      <p><img src="./assets/img/img4F.jpg" /></p>
      <p>e) La cartuchería con balas perforantes, explosivas o incendiarias, así como los proyectiles correspondientes.
      </p>
      <p><img src="./assets/img/img50.jpg" /><img src="./assets/img/img51.jpg" /><img src="./assets/img/img52.jpg" />
      </p>
      <p> f) Las municiones para pistolas y revólveres con proyectiles «dum-dum» (bala expansiva) o de punta hueca, así
        como
        los propios proyectiles. </p>
      <p><img src="./assets/img/img53.jpg" /></p>
      <p>g) Las armas de fuego largas de cañones recortados. </p>
      <p><img src="./assets/img/img54.jpg" /></p>
      <p>Queda prohibida la tenencia, salvo en el propio domicilio como objeto de adorno o de coleccionismo, de
        imitaciones de
        armas de fuego que por sus características externas puedan inducir a confusión sobre su auténtica naturaleza,
        aunque
        no puedan ser transformadas en armas de fuego. </p>
      <p><br /> Se exceptúan de la prohibición aquellas cuyos modelos hayan sido aprobados previamente por la Dirección
        General
        de la Guardia Civil, con arreglo a la normativa dictada por el Ministerio del Interior. </p>
      <p><br /> Queda prohibido el uso por particulares de cuchillos, machetes y demás armas blancas que formen parte de
        armamentos debidamente aprobados por autoridades u organismos competentes. Su venta requerirá la presentación y
        anotación del documento acreditativo del cargo o condición de las personas con derecho al uso de dichos
        armamentos.
      </p>
      <p><br /> También se prohíbe la comercialización, publicidad, compraventa, tenencia y uso de las navajas no
        automáticas
        cuya hoja exceda de 11 centímetros, medidos desde el reborde o tope del mango hasta el extremo. </p>
      <p><br /> No se considerarán comprendidas en las prohibiciones anteriores, la fabricación y comercialización con
        intervención de la Guardia Civil, en la forma prevenida en los artículos 12.2 y 106 de este Reglamento, la
        compraventa
        y la tenencia exclusivamente en el propio domicilio, con fines de ornato y coleccionismo, de las navajas no
        automáticas cuya hoja exceda de 11 centímetros. </p>
      <p><br /> <span> </span><b><u>Armas de guerra:</u></b> </p>
      <p><br /> Se consideran armas de guerra, quedando en consecuencia prohibidos su adquisición, tenencia y uso por
        particulares: </p>
      <p><br /> a) Armas de fuego o sistemas de armas de fuego de calibre igual o superior a 20 milímetros.<br /> <br />
        b) Armas de
        fuego o sistemas de armas de fuego de calibre inferior a 20 milímetros, cuyos calibres sean considerados por el
        Ministerio de Defensa como de guerra. </p>
      <p><br /> c) Armas de fuego automáticas. </p>
      <p>d) Las municiones para las armas indicadas en los apartados a) y b). </p>
      <p><br /> e) Los conjuntos, subconjuntos y piezas fundamentales de las armas y municiones indicadas en los
        apartados a) a
        d), así como, en su caso, sus sistemas entrenadores o subcalibres. </p>
      <p><br /> f) Bombas de aviación, misiles, cohetes, torpedos, minas, granadas, así como sus subconjuntos y piezas
        fundamentales. </p>
      <p><br /> g) Las no incluidas en los apartados anteriores y que se consideren como de guerra por el Ministerio de
        Defensa.
      </p>
      <p><br /> Un caso particular es el de los calibres 308 win (7'62 X 51 mm.) y 7'62 x 39 que son de los denominados
        de
        guerra, aun así podrán utilizarse para el ejercicio de la caza con bala expansiva y rifle de repetición. </p>
    </section>
    <section id="s-t3">
      <p><b> <span>Tema 3:</span></b></p>
      <p><b>CIRCULACIÓN DE ARMAS:</b></p>
      <p><u>Guías de circulación:</u><br /> <br /> La guía de circulación es el documento que ampara el traslado, sin
        licencia ni
        guía de pertenencia, entre dos lugares, de armas de las categorías 1.ª, 2.ª, 3.ª y 6.ª y sus piezas
        fundamentales y de
        las armas completas de la categoría 7.ª.1, 2, 3 y 4, aunque vayan despiezadas. Esta guía será expedida por la
        Intervención de Armas del lugar de compra.<br /> <br /> En la guía de circulación se reseñará la cantidad, tipo,
        marca y,
        en su caso, modelo, calibre, serie y número de fabricación o contraseña de las armas; si el envío lleva piezas;
        los
        nombres del remitente, consignatario y destinatario; el número de envases y la marca y el detalle del
        precinto.<br />
        <br /> Las guías de circulación ordinarias serán de dos clases:<br /> <br /> A) Guías de circulación para el
        territorio
        nacional y para tránsito.<br /> <br /> B) Guías de circulación para la exportación e importación.
      </p>
      <p><br /> <span> </span><u>Envases y precintos de armas y piezas fundamentales</u>:<br /> <br /> Las armas
        reglamentadas de
        cualquier categoría y sus piezas fundamentales acabadas circularán en envases debidamente acondicionados para su
        seguridad durante el traslado.<br /> <br /> Los envases para el comercio interior de armas de fuego no deberán
        contener
        más de 25 armas ni llevar armas cortas o largas de cañón estriado junto con escopetas de caza y
        asimiladas.<br /> <br />
        Los envases de armas de fuego para el comercio exterior pueden contener cualquier número de armas, siempre que
        ofrezcan suficientes garantías de seguridad.<br /> <br /> Cada envase puede llevar cualquier número de piezas,
        salvo que
        constituyan conjuntos ensamblables que puedan formar armas completas, en cuyo caso habrá de respetarse el límite
        de 25
        armas citado anteriormente; pero no pueden remitirse en un mismo envase ni reseñarse en la misma guía, armas o
        piezas
        que correspondan a distintos destinatarios.<br /> <br /> Los envases de armas cortas o largas de cañón estriado,
        escopetas
        de caza y armas asimiladas han de ser precintados por las Intervenciones de Armas de la Guardia Civil, o por los
        comerciantes de armas autorizados, que se responsabilizarán de su contenido.<br /> <br /> <u>Envío de armas y
          piezas
          fundamentales:</u><br /> <br /> Los envíos habrán de hacerse por ferrocarril o por empresas de transportes
        marítimas,
        aéreas o terrestres, debiendo efectuarse a través de empresas de seguridad siempre que excedan de 25 armas
        cortas o 50
        armas largas.<br /> <br /> En la misma forma, podrán ser remitidas armas de fuego por las Intervenciones de
        Armas de la
        Guardia Civil o con destino a las mismas.<br /> <br /> Las fábricas y armerías autorizadas podrán realizar los
        transportes
        utilizando sus propios medios.<br /> <br /> En ningún caso podrán hacerse envíos o transportes de armas cargadas
        ni de
        armas conjuntamente con cartuchería susceptible de ser utilizada con las armas transportadas.<br /> <br /> Al
        particular
        que desee adquirir una escopeta en localidad distinta a la de su residencia, la Intervención de Armas
        correspondiente
        a dicha localidad podrá expedir, a la vista del parte de venta y de la licencia E, una guía de circulación de
        aquélla.
        El interesado se presentará posteriormente, dentro de un plazo de diez días, en la Intervención de Armas de su
        residencia y solicitará la expedición de la correspondiente guía de pertenencia.<br /> <br /> <u>Recepción de
          expediciones</u>:<br /> <br /> Cuando los particulares que sean destinatarios de envíos de armas reciban
        comunicación
        del remitente de haberles sido enviadas a la consignación de la Intervención de Armas, se presentarán en ésta
        provistos de la licencia o documento que les autorice para adquirirlas, a fin de retirarlas previa documentación
        de
        las mismas, firmando su recepción en la filial de la guía de circulación.<br /> <br /> <span> </span><b><span>
          </span>REVISTA DE ARMAS:</b><br /> <br /> La obligatoriedad de la revista de armas. Cuándo se debe pasar y
        ante
        quién:<br /> <br /> <u>Las armas de la 1.ª categoría</u>, y todas las de concurso, pasarán revista <u>cada tres
          años</u>.
        <u>Las demás armas </u>que precisen guía de pertenencia, pasarán revista <u>cada cinco años</u>.<br /> <br />
        Las
        anotaciones de la revista de armas se llevarán a cabo en la forma que se determine y se realizarán por los
        Interventores de Armas.<br /> <br /> Para el pase de la revista, es inexcusable la presentación del arma,
        personalmente o
        por medio de tercero debidamente autorizado por escrito.<br /> <br /> El hecho de no pasar dos revistas
        consecutivas, a
        parte de la correspondiente sanción económica, será causa de anulación y retirada de la guía de pertenencia,
        debiendo
        quedar el arma depositada en la correspondiente Intervención de Armas. Constituye este hecho una infracción
        administrativa.<br /> <br /> <span> </span><b> TRANSFERENCIA DE ARMAS:</b><br /> <br /> <u>Cambio de
          titularidad</u>:<br /> <br />
        El particular que desee enajenar un arma tiene que hacer la cesión a persona que posea la licencia, tarjeta o
        certificado de inutilización correspondientes.<br /> <br /> La Intervención de Armas expedirá una nueva Guía de
        Pertenencia a la persona que recibe el arma o comprador.<br /> <br /> La cesión se hará con conocimiento de la
        Intervención de Armas, la cual recogerá la guía de pertenencia del vendedor y, a la vista del arma, extenderá
        una
        nueva al comprador en la forma prevenida.<br /> <br /> La guía de pertenencia recogida se anulará y se enviará a
        la
        Dirección General de la Guardia Civil para su anotación en el Registro Central de Guías y de Licencias.
      </p>
      <p><img src="./assets/img/img55.jpg" /><img src="./assets/img/img56.jpg" /></p>
      <p><u>Cesión temporal de armas:<br /> </u><br /> Tanto los españoles como los extranjeros residentes en España
        podrán
        prestar sus armas de caza a quienes estén provistos de licencia de caza y de la licencia de arma larga rayada
        para
        caza mayor o escopeta correspondiente, según los casos, con una autorización escrita, fechada y firmada, para su
        uso
        durante quince días como máximo y precisamente </p>
      <p>para cazar. También se podrán prestar, con autorización escrita, pistolas, revólveres y armas de concurso, para
        la
        práctica de tiro deportivo, a quienes estén reglamentariamente habilitados para su uso. Las armas se prestarán
        siempre
        con sus guías de pertenencia. </p>
      <p><br /> Con igual autorización y a los mismos efectos, podrán prestarse las documentadas con tarjeta de armas,
        acompañadas de este documento. </p>
