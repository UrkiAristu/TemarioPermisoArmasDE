    <section id="s-t4">
      <p> <b> <span>Tema 4:</span></b> </p>
      <p><br /> <b><span> </span>DOCUMENTACIÓN PARA LA TENENCIA Y USO DE ARMAS:</b> </p>
      <p><br /> <u>Tipos de licencia de armas:</u> </p>
      <p><br /> Nadie podrá llevar ni poseer armas de fuego en territorio español sin disponer de la correspondiente
        autorización expedida por los órganos administrativos a quienes este Reglamento atribuye tal competencia. Si se
        tratara de personas residentes en un Estado miembro de la Comunidad Económica Europea distinto de España, la
        concesión
        de la autorización deberá ser comunicada a la autoridad competente de dicho Estado. </p>
      <p><br /> La tenencia y el uso de las armas de las categorías 1.ª, 2.ª y 3.ª precisará de licencia de armas. </p>
      <p><br /> La licencia de armas A, con la eficacia de las licencias B, D y E, documentará las armas de las
        categorías 1.ª,
        2.ª y 3.ª de propiedad privada del personal de los Cuerpos Específicos de los Ejércitos, de los Cuerpos Comunes
        de las
        Fuerzas Armadas, de las Fuerzas y Cuerpos de Seguridad y del Servicio de Vigilancia Aduanera. </p>
      <p><br /> Las demás licencias para armas de las categorías 1.ª, 2.ª y 3.ª serán: </p>
      <p><br /> a) La licencia de armas B para armas de fuego cortas de particulares. </p>
      <p><br /> b) La licencia C, para armas de dotación del personal de vigilancia y seguridad no citadas en el párrafo
        anterior donde hemos hecho alusión a la licencia de armas A. </p>
      <p><br /> c) La licencia D de arma larga rayada para caza mayor. </p>
      <p><br /> d) Los poseedores de armas de las categorías 3.ª y 7.ª, 2 y 3, precisarán licencia de armas E. </p>
      <p><br /> La licencia de armas F documentará las armas de concurso de tiro deportivo de afiliados de federaciones
        deportivas que utilicen armas de fuego para la práctica de la correspondiente actividad deportiva. </p>
      <p><br /> Para llevar y usar armas de la categoría 4.ª se necesita obtener tarjeta de armas. </p>
      <p><br /> Los poseedores de armas de las categorías 6.ª y 7ª., 4, deberán documentarlas en la forma prevenida en
        el
        artículo 107. </p>
      <p><br /> Las autorizaciones de tenencia de fusiles de inyección anestésica deberán ser específicas para su uso en
        lugares
        concretos, y para poder adquirir dichas armas será necesaria la exhibición de las autorizaciones a los
        establecimientos vendedores que, previa comprobación de las mismas, anotarán la venta en los libros
        correspondientes.
      </p>
      <p><br /> Para la posesión y uso de armas combinadas que participen de las características de armas de más de una
        categoría, cuyo régimen no se halle especialmente determinado, se tendrá en cuenta, a efectos de documentación,
        el
        arma componente de mayor peligrosidad y habrá de obtenerse la autorización de menor duración y correspondiente a
        las
        armas que precisen mayores garantías a efectos de seguridad. </p>
      <p><br /> La solicitud de expedición de las licencias de armas habrá de presentarse en la Intervención de Armas de
        la
        Guardia Civil correspondiente al domicilio del interesado, acompañada de la siguiente documentación: </p>
      <p><br /> a) Certificado de antecedentes penales en vigor. </p>
      <p><br /> b) Fotocopia del documento nacional de identidad en vigor o, en su caso, de la tarjeta de autorización
        de
        residencia, que será cotejada con su original y devuelta al interesado. </p>
      <p><br /> c) Informe de las aptitudes psicofísicas. </p>
      <p><br /> Cuando se trate de la obtención de licencias sucesivas, el solicitante que sea titular de armas
        correspondientes
        a la licencia que se solicita habrá de presentar, con la solicitud de nueva concesión, el arma o armas
        documentadas,
        personalmente o por medio de tercero autorizado por escrito y que cuente con licencia correspondiente al arma o
        armas
        de que se trate, a efectos de revista. </p>
      <p><br /> Como norma general el solicitante de una nueva licencia de armas debe tener cumplidos los 18 años. No
        obstante,
        existe la posibilidad de autorizaciones especiales de uso de armas para menores: </p>
      <p><br /> Los españoles y extranjeros, con residencia en España, que sean mayores de dieciséis años y menores de
        dieciocho, podrán utilizar exclusivamente para la caza o para competiciones deportivas en cuyos Reglamentos se
        halle
        reconocida la categoría «junior», pero no poseer ni llevar dentro de las poblaciones, armas largas rayadas para
        caza
        mayor o, en su caso, de la categoría 3.ª, 1, siempre que se encuentren en posesión legal de una autorización
        especial
        de uso de armas para menores y vayan acompañados de personas mayores de edad, con licencia de armas D, E o F,
        que
        previamente se hayan comprometido a acompañarlos y vigilarlos en cada cacería o acto deportivo. </p>
      <p><br /> Con las mismas condiciones y requisitos, los mayores de catorce años y menores de dieciocho podrán
        utilizar las
        armas de la categoría 3.ª, 2, para la caza y las de la categoría 3.ª, 2 y 3 , para competiciones deportivas en
        cuyos
        Reglamentos se halle reconocida la categoría «junior», obteniendo una autorización especial de uso de armas para
        menores. </p>
      <p><br /> Las autorizaciones especiales de uso de armas para menores tendrán validez hasta la mayoría de edad de
        sus
        titulares, sin necesidad de obtener renovaciones, y será competente para concederlas el Director general de la
        Guardia
        Civil. </p>
      <p><br /> Las solicitudes se presentarán en las Comandancias o Puestos de la Guardia Civil correspondientes al
        domicilio
        del interesado suscritas por éste y por la persona que ejerce la patria potestad o la tutela sobre el mismo, y
        habrán
        de acompañarse los documentos siguientes:<br /> <br /> a) Certificado de antecedentes penales, si se trata de
        mayores de
        dieciséis años. </p>
      <p><br /> b) Certificado de antecedentes penales de la persona que ejerza la patria potestad o la tutela sobre el
        solicitante. </p>
      <p><br /> c) Fotocopias de los documentos nacionales de identidad en vigor de ambos, o de las tarjetas o
        autorizaciones de
        residencia si se trata de extranjeros, que serán cotejadas con sus originales, devolviéndose éstos a los
        interesados.
      </p>
      <p><br /> d) Autorización para el uso de armas de las clases expresadas, otorgada por la persona que ejerza la
        patria
        potestad o la tutela, responsabilizándose de su actuación, ante Notario, autoridad gubernativa, alcaldía,
        Comisaría de
        Policía, Comandancia, Intervención de Armas o Puesto de la Guardia Civil. </p>
      <p><br /> e) Informe de aptitudes psicofísicas. </p>
      <p><br /> No será necesaria la presentación de los documentos reseñados, relativos a la persona que ejerza la
        patria
        potestad o la tutela, si ésta se encuentra en posesión de cualquier licencia de armas en vigor. </p>
      <p><br /> Las solicitudes y los documentos señalados habrán de ser remitidos a la Dirección General de la Guardia
        Civil,
        acompañándose informe de conducta y antecedentes del interesado y de la persona que ejerza la patria potestad o
        la
        tutela. </p>
      <p><br /> Autorizaciones temporales de uso de armas en el caso de renovación y en el caso de pérdida, destrucción,
        robo o
        extravío: </p>
      <p><br /> Cuando los titulares de licencias de armas, próximas a caducar, soliciten su nueva concesión, las
        Intervenciones
        de Armas de la Guardia Civil que reciban las solicitudes con las correspondientes documentaciones podrán expedir
        a los
        solicitantes autorizaciones temporales de uso de dichas armas, cuyo plazo de validez será de tres meses,
        recogiéndoles
        al propio tiempo las licencias próximas a caducar. </p>
      <p><br /> En todo caso de pérdida, destrucción, robo o sustracción de armas de las categorías 1.ª, 2.ª y 3.ª el
        titular
        deberá dar cuenta inmediata por conducto jerárquico cuando proceda, a la Intervención de Armas de la Guardia
        Civil
        correspondiente con entrega de la guía de pertenencia. Si del procedimiento que instruya la Intervención de
        Armas en
        averiguación de los hechos, resultara comprobada la destrucción del arma o se dedujera la falta de
        responsabilidad del
        interesado, éste conservará su licencia, pudiendo adquirir otra arma en la forma establecida, sin que se le
        imponga
        sanción alguna. </p>
      <p><br /> Cuando se hubieran perdido, destruido, robado o sustraído las licencias o las guías de pertenencia, el
        titular
        deberá asimismo dar cuenta inmediata a la Intervención de Armas, que podrá extender autorización temporal de uso
        de
        armas, válida durante la tramitación del procedimiento, o exigir el inmediato depósito de las armas. Si como
        consecuencia del procedimiento que se instruya resulta que no existe culpa por parte del interesado, se le
        expedirá
        nueva documentación definitiva, procediéndose en su caso a anular la extraviada, robada o sustraída y se le
        devolverán
        las armas si siguieran depositadas. </p>
      <p><br /> Guías:<br /> <br /> Para la tenencia de las armas de las categorías 1.ª, 2.ª, 3.ª, 6.ª y 7.ª; 1, 2, 3 y
        4, cada arma
        habrá de estar documentada con su correspondiente guía de pertenencia. </p>
      <p><br /> Como norma general las guías de pertenencia serán expedidas a los titulares de las armas por las
        Intervenciones
        de Armas. </p>
      <p><br /> En la guía de pertenencia, extendida en el correspondiente impreso confeccionado por la Dirección
        General de la
        Guardia Civil, se harán constar el número del documento nacional de identidad o documento equivalente y los
        datos
        personales del propietario del arma, así como los de la licencia correspondiente; contendrá una reseña completa
        del
        arma; y la acompañará siempre, en los casos de uso, depósito y transporte. </p>
      <p><br /> En los casos en que el titular de las armas sea un organismo, entidad o empresa, se hará constar su
        denominación
        o razón social en el lugar correspondiente de la guía. </p>
      <p><br /> En la misma guía del arma se reseñarán, en su caso, los cañones, tambores, calibres y subcalibres
        intercambiables que se adquieran para usar con aquélla, siempre que no supongan cambio de categoría del arma.
      </p>
      <p><br /> Categoría y número de armas que amparan las Licencias de Armas: </p>
      <p><br /> Las armas de las categorías 3.ª y 7.ª, 2 y 3, precisarán una licencia E de armas, que autorizará para
        poseer,
        llevar y usar las armas de dichas categorías. Su número no excederá de seis escopetas o de seis armas largas
        rayadas
        para tiro deportivo, ni de doce armas en total. </p>
      <p><br /> Tarjetas de armas: </p>
      <p><br /> Como norma general, la tenencia de arma de fuego reglamentada durante un viaje por España por parte de
        un
        residente de otro país miembro de la Unión Europea solamente será autorizada por la Dirección General de la
        Policía y
        de la Guardia Civil, ámbito de la Guardia Civil, si el interesado ha obtenido a tal efecto la Tarjeta Europea de
        Armas
        de Fuego. </p>
      <p><br /> Igualmente los españoles y extranjeros residentes en España que se desplacen a otro país de la Unión
        Europea
        deberán estar en posesión de la Tarjeta Europea de Armas de Fuego. </p>
      <p><br /> A las personas mencionadas en el apartado primero podrá concedérseles una autorización para uno o varios
        desplazamientos y para un plazo máximo de un año, renovable. Dicha autorización se hará constar en la Tarjeta
        Europea
        de Armas de Fuego, que el viajero deberá exhibir dentro de España ante todo requerimiento de los miembros de las
        Fuerzas y Cuerpos de Seguridad. </p>
      <p><br /> No obstante lo dispuesto en el apartado primero, los cazadores respecto a las armas de caza de las
        categorías
        2.ª, 2 y 3.ª, 2 y los tiradores deportivos, respecto a las armas de concurso de las categorías 1.ª, 2.ª y 3.ª,
        podrán
        tener en su poder sin autorización previa una o varias armas de fuego durante un viaje a España con el fin de
        practicar sus actividades, siempre y cuando estén en posesión de una Tarjeta Europea de Armas de Fuego, en la
        que se
        enumeren dicha o dichas armas de fuego y puedan probar el motivo del viaje, en particular exhibiendo una
        invitación u
        otra prueba de sus actividades de caza o de tiro deportivo en nuestro país. No se podrá condicionar la
        aceptación de
        una Tarjeta Europea de Armas de Fuego emitida por otro Estado al pago de tasas o cánones. </p>
      <p><br /> La Tarjeta Europea de Armas de Fuego será expedida, previa solicitud, por la Dirección General de la
        Policía y
        de la Guardia Civil, ámbito de la Guardia Civil, a los residentes en España que estén debidamente documentados
        para la
        tenencia y uso en territorio español de las armas de que se trate. Será válida por un período máximo de cinco
        años,
        que podrá prorrogarse mientras se mantenga la titularidad de las armas que ampare. La Tarjeta Europea de Armas
        de
        Fuego será intransferible y se harán constar en ella el arma o las armas de fuego que posea y utilice el titular
        de la
        Tarjeta. El usuario del arma de fuego deberá llevar siempre consigo la Tarjeta. Se mencionarán en la Tarjeta los
        cambios en la tenencia o en las características de las armas, así como la pérdida o robo de las mismas. Los
        visados
        que se lleven a cabo sobre esta Tarjeta cuando sea utilizada para su entrada en España no estarán gravados por
        ningún
        tipo de tasa o canon. </p>
      <p><br /> Al expedir la Tarjeta Europea de Armas de Fuego se informará por escrito al titular sobre los Estados
        miembros
        de Unión Europea que tengan prohibidas o sometidas a autorización la adquisición y tenencia de las armas de
        fuego a
        que se refiera la tarjeta. </p>
      <p><br /> <b>CONDICIONES GENERALES PARA LA OBTENCIÓN DE LICENCIAS Y TARJETAS EUROPEAS DE ARMAS DE FUEGO:</b> </p>
      <p><br /> Quienes pueden ser los titulares de las Licencias de Armas, Autorizaciones y de las Tarjetas Europeas,
        que
        requisitos se necesitan para ello, cuando caducan y que ámbito de validez tienen: </p>
      <p><br /> Citaremos en este apartado aquellos puntos que aun habiendo sido ya tratados anteriormente, gozan de
        especial
        interés por aparecer de manera específica en las preguntas de la prueba teórica: </p>
      <p><br /> Se podrá acreditar, para la solicitud de licencias de armas tipo “D”, la práctica del ejercicio de la
        caza
        mediante la presentación de una licencia de caza. </p>
      <p><br /> Se les podrá expedir una Tarjeta Europea de Armas a aquellos españoles y extranjeros residentes en
        España. </p>
      <p><br /> En la renovación de la Tarjeta Europea de Armas se exigirá mantener la titularidad de las armas que
        ampare dicha
        Tarjeta. </p>
      <p><br /> Las autorizaciones especiales de uso de armas para menores tendrán validez hasta la mayoría de edad.
      </p>
      <p><br /> La edad mínima para utilizar un arma larga rayada para caza o tiro deportivo será de 16 años.<br />
        <br /> La edad
        mínima para utilizar armas de las categorías 3ª.2 y 3ª.3 será de 14 años. </p>
      <p><br /> Los menores cuando utilicen armas de la categoría 2ª.2 o 3ª, irán siempre acompañados por personas
        mayores de
        edad con licencias de armas D, E o F. Estas personas se habrán comprometido previamente a acompañarlo y
        vigilarlo en
        cada cacería o acto deportivo. </p>
      <p><br /> Estos menores no podrán ser titulares de escopetas ni rifles. </p>
      <p><br /> Las solicitudes de autorizaciones especiales de uso de armas para menores estarán suscritas por el
        interesado y
        por la persona que ejerce la patria potestad o tutela. </p>
      <p><br /> Para mantener la vigencia de las licencias de armas con la duración asociada a cada una de ellas, las
        expedidas
        a mayores de sesenta años necesitarán ser visadas cada dos años por la autoridad competente, previa aportación
        por el
        interesado de informe favorable, expedido por un centro de reconocimiento autorizado o, en su caso, previa
        superación
        de las correspondientes pruebas complementarias de aptitud. Respecto a las expedidas a mayores de setenta años,
        dicha
        formalidad deberá efectuarse con carácter anual. </p>
      <p><br /> Causas de revocación de las licencias de armas y plazos: </p>
      <p><br /> En caso de no mantenerse los requisitos que se exigen para el otorgamiento de una licencia de armas
        procede
        revocar dicha licencia. </p>
      <p><br /> La retirada de las armas implica la desposesión de las mismas y la prohibición de la adquisición y
        tenencia de
        otras durante el plazo que se determine, que no podrá exceder de dos años. </p>
      <p><br /> La retirada de las licencias o autorizaciones especiales supone la revocación de los mismos; constituirá
        impedimento para su renovación durante el tiempo, no superior a dos años, por el que hubiere sido impuesta, e
        implicará el depósito obligatorio de las armas. </p>
      <p><br /> Tanto la retirada de las armas como la de las licencias o autorizaciones especiales será comunicada por
        la
        autoridad sancionadora al Registro Central de Guías y de Licencias, y se anotará en su caso en la Tarjeta
        Europea de
        Armas de Fuego. </p>
      <p><br /> La vigencia de una licencia de armas estará condicionada al mantenimiento de los requisitos exigibles en
        el
        Reglamento de Armas. La Administración podrá comprobar el mantenimiento de dichos requisitos para mantener la
        vigencia
        de la licencia de armas en cualquier momento. </p>
      <p><br /> <b><span> </span>TRÁMITE DE LAS SOLICITUDES:</b> </p>
      <p><br /> Requisitos para la obtención de licencias de armas “E” y “D” (Orden de 18 de marzo de 1998 del Mº del
        Interior y
        Resolución de 19 de octubre de 1998 de la D.G.G.C.): </p>
      <p><br /> Para obtener licencia para la tenencia y uso de armas largas rayadas para caza mayor o para escopetas y
        armas
        asimiladas se superarán unas pruebas de capacitación que versarán sobre el conocimiento de las armas, su cuidado
        y
        conservación y sobre habilidad para su manejo y utilización. </p>
      <p><br /> A quién se debe conceder las Licencias de Armas, las Tarjetas Europeas de Armas y las Tarjetas de armas,
        qué
        documentos deben presentarse, cuáles son las causas de su concesión y quién las expide: </p>
      <p><br /> La Guía de Pertenencia de un arma la expide el Interventor de Armas. </p>
      <p><br /> La solicitud de expedición de las licencias de armas habrá de presentarse en la Intervención de Armas de
        la
        Guardia Civil correspondiente al domicilio del interesado, acompañada de la siguiente documentación: </p>
      <p><br /> a) Certificado de antecedentes penales en vigor. </p>
      <p><br /> b) Fotocopia del documento nacional de identidad en vigor o, en su caso, de la tarjeta de autorización
        de
        residencia, que será cotejada con su original y devuelta al interesado. </p>
      <p><br /> c) Informe de las aptitudes psicofísicas. </p>
      <p><br /> En caso de solicitarse licencias de armas tipo E, también se adjuntará acreditación de la dedicación
        real al
        ejercicio de la caza o de los deportes correspondientes. </p>
      <p><br /> Cuando se trate de la obtención de licencias sucesivas, el solicitante que sea titular de armas
        correspondientes
        a la licencia que se solicita habrá de presentar, con la solicitud de nueva concesión, el arma o armas
        documentadas,
        personalmente o por medio de tercero autorizado por escrito y que cuente con licencia correspondiente al arma o
        armas
        de que se trate, a efectos de revista. </p>
      <p><br /> Las solicitudes para la expedición de la licencia de armas se presentarán en la Intervención de Armas de
        la
        Guardia Civil correspondiente al domicilio del interesado. </p>
      <p><br /> <span> </span><br /> </p>
    </section>
    <section id="s-t5">
      <p> <b> <span>Tema 5:</span></b> </p>
      <p><br /> <span> </span><b>RÉGIMEN SANCIONADOR</b>: </p>
      <p><br /> En materia de armas los hechos pueden ser constitutivos de infracciones penales e infracciones
        administrativas.
        Estas últimas pueden dividirse en muy graves, graves y leves. </p>
      <p><br /> Las autoridades competentes para ordenar la instrucción de un procedimiento sancionador en materia de
        armas son:
        el Director General de la Guardia Civil, el Delegado de Gobierno y los Alcaldes. </p>
      <p><br /> Prescripción de infracciones administrativas y sanciones: </p>
      <p><br /> Las infracciones administrativas leves prescribirán a los 3 meses. </p>
      <p><br /> Las infracciones administrativas graves prescribirán al año. </p>
      <p><br /> Las infracciones administrativas muy graves prescribirán a los dos años. </p>
      <p><br /> Las sanciones leves prescribirán al año. </p>
      <p><br /> Las sanciones graves prescribirán a los dos años. </p>
      <p><br /> Las sanciones muy graves prescribirán a los cuatro años. </p>
      <p><br /> Dichas sanciones serán ejecutivas cuando las resoluciones adquieran firmeza en vía administrativa. </p>
      <p><br /> En ningún caso podrán imponerse sanciones penales y administrativas para un mismo hecho.<br /> <br />
        <b><span>
          </span>INFRACCIONES MUY GRAVES, GRAVES Y LEVES:</b> </p>
      <p><br /> Si no constituyeren delitos, serán consideradas infracciones muy graves por la entidad del riesgo
        producido y
        sancionadas: </p>
      <p><br /> a) La fabricación, reparación, almacenamiento y comercio: </p>
      <p><br /> 1. De armas de fuego prohibidas o de armas de guerra sin la adecuada habilitación, con multa de
        30.050,61 a
        601.012,1 euros e incautación de las armas y de los instrumentos o efectos utilizados para la comisión de la
        infracción y clausura de las fábricas, locales o establecimientos, desde seis meses y un día hasta dos años de
        duración. </p>
      <p><br /> 2. De armas de fuego de defensa personal, de armas largas rayadas, de armas de vigilancia y guardería y
        de armas
        largas de ánima lisa, sin la pertinente autorización, con multas de 30.050,61 a 300.506,05 euros, incautación de
        las
        armas, de los instrumentos o efectos utilizados para la comisión de la infracción, y clausura de las fábricas,
        locales
        o establecimientos, desde seis meses y un día hasta un año de duración. </p>
      <p><br /> b) El uso de armas de fuego prohibidas, con multa de 30.050,61 a 60.101,21 euros e incautación de las
        armas
        utilizadas y de sus municiones. </p>
      <p><br /> c) El uso de armas de fuego cortas, careciendo de la licencia, autorización especial o de la guía de
        pertenencia, con multa de 30.050,62 a 60.101,21 euros e incautación de las armas utilizadas y de sus municiones.
      </p>
      <p><br /> d) La omisión, insuficiencia o ineficacia de las medidas o precauciones obligatorias para garantizar la
        seguridad en las fases de fabricación, reparación, almacenamiento, distribución y comercio, de armas de defensa
        personal, de armas de vigilancia y guardería o de armas largas rayadas, con multa de 30.050,62 a 300.056,05
        euros,
        conjunta o alternativamente con suspensión temporal de las autorizaciones, desde seis meses y un día hasta un
        año de
        duración. Si como consecuencia de la infracción se hubiera producido pérdida, sustracción o robo de armas,
        además de
        la multa, se impondrá la clausura de las fábricas, locales o establecimientos, desde seis meses y un día hasta
        dos
        años de duración. </p>
      <p><br /> Si no constituyeren delito, serán consideradas infracciones graves, y sancionadas: </p>
      <p><br /> a) Cuando se trate de armas blancas, de aire comprimido o de las demás comprendidas en las categorías
        4.ª a 7.ª,
        la fabricación, reparación, almacenamiento, distribución y comercio de armas prohibidas o de armas reglamentadas
        sin
        autorización, con multas de 300,51 a 30.050,61 euros, clausura de las fábricas, locales y establecimientos de
        hasta
        seis meses de duración e incautación de los instrumentos o efectos utilizados para la comisión de la infracción.
      </p>
      <p><br /> b) La omisión, insuficiencia o ineficacia de las medidas o precauciones obligatorias para garantizar la
        seguridad en las fases de fabricación, reparación, almacenamiento, circulación y comercio de armas largas de
        ánima
        lisa o de otras armas cuya tenencia requiera licencia E, con multa de 300,51 a 30.050,61 euros. Si como
        consecuencia
        de la infracción se hubiera producido pérdida, sustracción o robo de armas, además de la multa, se impondrá la
        clausura de las fábricas, locales o establecimientos de hasta seis meses de duración. </p>
      <p><br /> c) La omisión, insuficiencia o ineficacia de las medidas o precauciones obligatorias para garantizar la
        seguridad de las armas que posean los particulares, en los domicilios o lugares de uso, o en circulación, si es
        de
        armas de defensa personal, de armas de vigilancia y guardería o de armas largas rayadas, con multa de 300,51 a
        3.005,06 euros. Si como consecuencia de la infracción se hubiera producido pérdida, sustracción o robo de las
        armas,
        las sanciones serán de hasta 6.010,12 euros y retirada de las licencias o permisos correspondientes a aquéllas,
        de
        hasta seis meses de duración. </p>
      <p><br /> d) La omisión, insuficiencia o ineficacia de las medidas o precauciones obligatorias para garantizar la
        seguridad de las armas en los domicilios o lugares de uso, o en circulación, con multa de 300,51 a 1.502,53
        euros, si
        se trata de armas largas de ánima lisa, y con multa de hasta 3.005,06 euros, si como consecuencia se hubiera
        producido
        pérdida, sustracción o robo de las armas. </p>
      <p><br /> e) El impedimento o la omisión de la colaboración obligatoria para la realización de los controles o
        inspecciones prevenidos sobre la fabricación, reparación, almacenamiento, distribución, comercio, tenencia y
        utilización, con multa de 300,52 a 30.050,61 euros, conjunta o alternativamente con suspensión temporal de hasta
        seis
        meses de duración, si se trata de armas de defensa personal, de armas de vigilancia y guardería, de armas largas
        rayadas o de armas largas de ánima lisa. </p>
      <p><br /> f) La adquisición, tenencia, cesión o enajenación de armas por particulares, sin tener las
        autorizaciones o
        licencias prevenidas al efecto o la alegación de datos o circunstancias falsos para su obtención, con multa de
        300,51
        a 1.202,02 euros, si se trata de armas de defensa personal, de armas de vigilancia y guardería, de armas largas
        rayadas o de armas de ánima lisa. </p>
      <p><br /> g) El uso de cualesquiera clase de armas de fuego reglamentadas no incluidas en los apartados b) y c) de
        apartado anterior (infracciones muy graves), careciendo de la licencia, autorización o de la guía de
        pertenencia, con
        multas de 300,51 a 601,01 euros e incautación de las armas. </p>
      <p><br /> h) El uso de cualesquiera clase de armas de fuego reglamentarias, con omisión o insuficiencia de las
        medidas o
        precauciones obligatorias para garantizar la seguridad de las personas y de las cosas, con multas de 300,51 a
        6.010,12
        euros y retirada de las armas y municiones objeto de la infracción, así como de las licencias y guías de
        pertenencia
        correspondientes a las mismas, desde seis meses y un día hasta dos años de duración. </p>
      <p><br /> i) Portar armas de fuego o de cualesquiera otra clase en establecimientos públicos y lugares de reunión,
        concentración, recreo o esparcimiento, salvo en los lugares habilitados para su uso, con multas de 300,51 a
        450,76
        euros, incautación de las armas y, en su caso, retirada de las licencias o permisos correspondientes. </p>
      <p><br /> j) Utilizar armas de fuego o de cualesquiera otra clase, sin adoptar las medidas o precauciones
        necesarias para
        no causar peligro, daños, perjuicios o molestias a terceras personas o a sus bienes, o contraviniendo las
        prohibiciones establecidas en el artículo 146 de este Reglamento, con multas de 300,51 a 601,01 euros,
        incautación de
        las armas y, en su caso, retirada de las licencias o autorizaciones correspondientes. </p>
      <p><br /> Si no constituyeren delito, serán consideradas infracciones leves y sancionadas: </p>
      <p><br /> a) Las tipificadas en los apartados b) a f) del apartado anterior, referidas a armas blancas, de aire
        comprimido, o las demás comprendidas en las categorías 4.ª a 7.ª, con multas de hasta 300,51 euros. </p>
      <p><br /> b) La omisión de las revistas, de los depósitos o de la exhibición de las armas a los agentes de la
        autoridad,
        cuando sean obligatorios: </p>
      <p><br /> 1. Con multa de hasta 300,51 euros y retirada de las armas, cuando se trate de armas de las categorías
        1.ª y
        2.ª. </p>
      <p><br /> 2. Con multa de hasta 150,25 euros y retirada de las armas, cuando se trate de las restantes armas
        sometidas a
        revista. </p>
      <p><br /> c) El incumplimiento de la obligación de dar cuenta a la Guardia Civil de la pérdida, destrucción, robo
        o
        sustracción de las armas: </p>
      <p><br /> 1. Con multa de hasta 300,51 euros y retirada de la licencia correspondiente, cuando se trate de armas
        que la
        precisen. </p>
      <p><br /> 2. Con multas de hasta 150,25 euros, cuando se trate de armas que no precisen licencia. </p>
      <p><br /> d) El incumplimiento de la obligación de dar cuenta a la Guardia Civil de la pérdida, destrucción, robo
        o
        sustracción de las licencias o guías de pertenencia, con multa de hasta 150,25 euros y retirada de las armas.
      </p>
      <p><br /> e) La omisión de cualquiera otra clase de información o de las declaraciones que sean obligatorias: </p>
      <p><br /> 1. Con multa de hasta 300,51 euros, cuando se trate de armeros profesionales. </p>
      <p><br /> 2. Con multa de hasta 150,25 euros, cuando se trate de particulares. </p>
      <p><br /> f) Las demás contravenciones del presente Reglamento no tipificadas como infracciones muy graves o
        graves, con
        multas de hasta 300,51 euros, conjunta o alternativamente con incautación de los instrumentos o efectos
        utilizados o
        retirada de las armas o de sus documentaciones. </p>
      <p><br /> <span> </span><b>RETIRADA DE LAS ARMAS:</b> </p>
      <p><br /> La retirada de las armas implica la desposesión de las mismas y la prohibición de la adquisición y
        tenencia de
        otras durante el plazo que se determine, que no podrá exceder de dos años. </p>
      <p><br /> La retirada de las licencias o autorizaciones especiales supone la revocación de los mismos; constituirá
        impedimento para su renovación durante el tiempo, no superior a dos años, por el que hubiere sido impuesta, e
        implicará el depósito obligatorio de las armas. </p>
      <p><br /> Tanto la retirada de las armas como la de las licencias o autorizaciones especiales será comunicada por
        la
        autoridad sancionadora al Registro Central de Guías y de Licencias, y se anotará en su caso en la Tarjeta
        Europea de
        Armas de Fuego. </p>
      <p><br /> Se considerará ilícito el hecho de llevar o usar armas los concurrentes a establecimientos públicos o
        lugares de
        reunión. </p>
      <p><br /> En ningún caso podrán recortarse en casa los cañones de un arma sea cual sea su fin. </p>
      <p><br /> <span> </span><br /> </p>
    </section>
    <section id="s-t6">
      <p> <b> <span>Tema 6:</span></b> </p>
      <p><br /> <span> </span><b> REPARACIÓN DE ARMAS:</b> </p>
      <p><br /> La reparación de armas de fuego se hará solamente por las industrias que las hubiesen fabricado o por
        armeros,
        autorizados por la Intervención de Armas de la Guardia Civil, con establecimientos abiertos e inscritos en un
        registro
        que llevará la misma Intervención. </p>
      <p><br /> Toda industria o establecimiento que repare armas llevará un libro en el que anote las entradas y
        salidas de las
        mismas, con datos de arma y propietario, enviando mensualmente a la Intervención de Armas correspondiente, una
        copia
        de las anotaciones sentadas en el mismo. </p>
      <p><br /> No se admitirá ningún arma a reparar si no va acompañada de su guía de pertenencia, la cual quedará en
        poder del
        armero mientras dure la reparación y será en su momento devuelta al interesado con el arma. Este documento
        deberá ser
        sustituido por una guía de circulación, expedida por la Intervención de Armas de origen, cuando el propietario
        del
        arma que desee repararla resida en localidad distinta a la del armero y no la lleve personalmente. </p>
      <p><br /> En ningún caso se permitirá que la reparación suponga modificación de las características, estructura o
        calibre
        del arma sin conocimiento de la Intervención de Armas de la Guardia Civil y aprobación en su caso del Ministerio
        de
        Defensa, previa obtención de la documentación correspondiente. </p>
      <p> <span> </span><br /> <br /> <span> </span><b>PRUEBA DE ARMAS:</b> </p>
      <p><br /> Los fabricantes y comerciantes autorizados y sus representantes, así como los representantes de
        fabricantes y
        comerciantes extranjeros, con permiso de la Intervención de Armas de la Guardia Civil, que expresará el
        contenido y el
        tiempo de duración, podrán probar las armas objeto de su fabricación o comercio en los campos de las
        Federaciones
        deportivas o en los polígonos, campos o galerías de tiro legalmente autorizados para ello, así como en terrenos
        cinegéticos controlados. </p>
      <p><br /> También pueden dejar a prueba dichas armas a las personas que, estando interesadas en adquirirlas,
        posean la
        correspondiente licencia, a cuyo efecto el fabricante, comerciante o sus representantes expedirán un documento
        de
        carácter personal e intransferible a la persona que vaya a realizar las pruebas, con arreglo a modelo oficial,
        en el
        que se reseñen el arma o armas, la licencia y el lugar de las pruebas, con un plazo de validez de cinco días, si
        se
        han de efectuar en la misma localidad, y de diez días, en otro caso. Dicho documento deberá ser previamente
        visado por
        la Intervención de Armas de la Guardia Civil correspondiente, sin cuyo requisito no será válido. </p>
      <p> <b><span> </span>DEPÓSITO DE ARMAS:</b> </p>
      <p><br /> En caso de fallecimiento del titular, los herederos o albaceas deberán depositar las armas en la
        Intervención de
        Armas de la Guardia Civil, tratándose de particulares, y en los servicios de armamento de sus propios Cuerpos o
        Unidades, si son titulares de licencia A, donde quedarán durante un año a su disposición por si alguno de ellos
        pudiese legalmente adquirirlas y quisiera hacerlo. El depósito deberán efectuarlo tan pronto como tengan
        conocimiento
        de la obligación de hacerlo y en cualquier caso dentro de los seis meses siguientes al fallecimiento. </p>
      <p><br /> Durante el indicado plazo de un año, también podrán los herederos enajenar el arma o recuperarla,
        documentándola
        o inutilizándola, para conservarla como recuerdo familiar o afectivo. </p>
      <p><br /> Transcurrido dicho plazo sin que el arma hubiera recibido ninguno de los destinos previstos en los
        apartados
        anteriores, se enajenará en pública subasta y se entregará su importe a los herederos o se ingresará a su
        disposición
        en la Caja General de Depósitos. </p>
      <p><br /> Al depositar las armas, se entregarán las guías de pertenencia para su anulación y comunicación al
        Registro
        Central de Guías y de Licencias. </p>
      <p><br /> Si en cualquier momento cesa la habilitación para la tenencia legal de las armas, el interesado deberá
        depositarlas inmediatamente. </p>
      <p><br /> No pasar dos revistas consecutivas de un arma será motivo de retirada de la guía de pertenencia teniendo
        que
        depositar el arma inmediatamente. </p>
      <p><br /> En caso de anulación, caducidad o extravío de la licencia de armas. También deberá depositar las armas
        inmediatamente junto con sus guías de pertenencia. </p>
      <p><br /> Si lo que se extravía es la guía de pertenencia, deberá depositarse inmediatamente el arma
        correspondiente a esa
        guía. </p>
      <p><br /> Cualquier titular puede presentarse en la Intervención de Armas que le corresponda cuando estime
        oportuno si
        desea no continuar poseyendo sus armas depositándolas para que sean subastadas o bien sean reducidas a chatarra.
      </p>
      <p><br /> Las armas depositadas por infracción podrán ser recuperadas posteriormente. No obstante, cuando los
        titulares de
        las mismas no deseen recuperarlas podrán ser subastadas. </p>
      <p><br /> En las importaciones, las armas llegadas a un aeropuerto que no fuesen retiradas por sus destinatarios
        después
        de despachadas por las aduanas permanecerán depositadas a disposición del interesado un plazo máximo de un año.
      </p>
      <p><span> </span></p>
    </section>
    <section id="s-practica">
      <p><b><span>TEMARIO OBJETO DE ESTUDIO PARA LA OBTENCIÓN DEL PERMISO DE ARMAS – PRUEBA PRÁCTICA:</span></b><br />
        <br />
        <span> </span>Una vez que hayas superado la prueba teórica tendrás que examinarte de la parte práctica. A
        continuación
        te exponemos brevemente en qué consisten y en qué se fija la Guardia Civil para valorar tu habilidad en el
        manejo y
        utilización de las armas que amparan las licencias D, E, y AEM (autorización especial de menores).<br /> <br />
        Debemos
        recordar que hay que acudir a la prueba con el arma descargada y desmontada, en el caso de escopetas o rifles
        con
        cañones paralelos o superpuestos. En ningún momento montaremos, ni cargaremos ni, por supuesto, realizaremos
        ningún
        disparo sin que el instructor de la Guardia Civil encargado de la realización de las pruebas nos lo indique.
      </p>
      <p><br /> <br /> Acción de cargar el arma:<br /> <br /> ·<span> </span> Valoración positiva:<br /> <br />
        Realización correcta de
        todos los actos precisos para que el arma quede lista para producir el disparo.<br /> <br /> Consistirá en
        cargar el arma
        apuntando hacia el suelo. Lo dejaremos con el seguro accionado y siempre apuntando hacia el lugar donde se
        encuentra
        la diana a la que debemos disparar. No nos encararemos el arma ni pondremos el dedo en el gatillo hasta que nos
        lo
        indiquen. </p>
      <p><img src="./assets/img/imgE1.jpg" /><img src="./assets/img/imgF1.jpg" /><img src="./assets/img/img10.jpg" />
      </p>
      <p>·<span> </span>Aspectos negativos:<br /> <br /> No ejecutar de forma correcta todos los actos precisos para que
        el arma
        quede lista para producir el disparo.<br /> <br /> Dirigir la boca de fuego del arma a lugar distinto del de
        localización
        de los blancos.<br /> <br /> Efectuar durante esta acción algún disparo.<br /> <br /> Colocar durante esta
        acción el dedo en
        el disparador.<br /> <br /> <span> </span>Acción de apuntar:<br /> <br /> ·<span> </span>Valoración
        positiva:<br /> <br />
        Utilización correcta de los órganos visuales y miembros superiores del tirador para obtener la alineación de los
        elementos de puntería del arma con el blanco.<br /> <br /> Utilización de sus miembros inferiores para obtener
        una
        estabilidad suficiente que mantenga durante un tiempo prudencial dicha alineación. </p>
      <p><span> <img src="./assets/img/clip_image008.jpg" /></span> </p>
      <p>·<span> </span>Aspectos negativos:<br /> <br /> No utilizar correctamente los órganos visuales y miembros
        superiores del
        tirador para obtener la alineación de los elementos de puntería del arma con el blanco.<br /> <br /> Utilización
        incorrecta de sus miembros inferiores para obtener una estabilidad suficiente que mantenga durante un tiempo
        prudencial dicha alineación.<br /> <br /> Dirigir la boca de fuego del arma a lugar distinto del de colocación
        de los
        blancos.<br /> <br /> Colocar durante esta acción el dedo en el disparador.<br /> <br /> Efectuar durante esta
        acción algún
        disparo. Recuerda que en este paso sólo se trata de ¡apuntar!<br /> <br /> <span> </span>Acción de
        disparar:<br /> <br /> Se
        realizará en la posición de pie y sin apoyo.<br /> <br /> Es en este momento, aún apuntado a la diana y una vez
        el
        instructor de tiro nos dé la orden, cuando sin desencararnos, quitaremos el seguro, pondremos el dedo en el
        gatillo y
        realizaremos el disparo. </p>
      <p><span> <img src="./assets/img/clip_image010.jpg" /></span> </p>
      <p>-<span> </span>Con las armas largas rayadas:<br /> <br /> Se realizarán cinco disparos a una diana de 50
        centímetros de
        diámetro, situada a 25 metros de la línea de tiro.<br /> <br /> ·<span> </span> Valoración positiva:<br />
        <br /> Realización
        de los cinco disparos con resultado de, al menos, un impacto en la diana.<br /> <br /> ·<span> </span>Aspectos
        negativos:<br /> <br /> Dirigir la boca de fuego del arma a lugar distinto del de localización de los
        blancos.<br /> <br />
        Efectuar algún disparo antes o después del toque de silbato que indique el comienzo o final de la acción.<br />
        <br />
        Realización de los cinco disparos sin obtener, al menos, un impacto en la diana.<br /> Finalizado el ejercicio,
        quedar
        algún cartucho sin disparar.<br /> <br /> <span> </span>-<span> </span>Con escopetas:<br /> <br /> Se realizarán
        dos disparos
        a una diana de 50 centímetros de diámetro, situada a 25 metros de la línea de tiro.<br /> <br /> ·<span> </span>
        Valoración positiva:<br /> <br /> Obtener un plomeo suficiente sobre la misma, de acuerdo con el arma
        empleada.<br /> <br />
        ·<span> </span>Aspectos negativos:<br /> <br /> Dirigir la boca de fuego del arma a lugar distinto del de
        localización de
        los blancos.<br /> <br /> Efectuar algún disparo antes o después de haber dado la señal que indique el comienzo
        o final de
        la acción.<br /> <br /> Realización de los dos disparos sin obtener un plomeo suficiente en la diana.<br />
        <br /> Finalizado
        el ejercicio, que el arma quede con algún cartucho sin disparar.<br /> <br /> Acción de descargar:<br /> <br />
        ·<span>
        </span> Valoración positiva:<br /> <br /> Realización correcta de todos los actos precisos para retirar del arma
        el o los
        casquillos utilizados en el disparo. Lo realizaremos siempre apuntando al suelo y sin girarnos. Es decir, aún
        mirando
        hacia la posición de la diana. En el caso de escopetas superpuestas o paralelas con expulsores automáticos puede
        ponerse la mano para evitar que las vainas puedan molestar a algún compañero al ser expulsadas.<span> </span>
      </p>
      <p>El arma por tanto, debe quedar lista para ser cargada de nuevo. Es decir, abierta o con el cerrojo o carro
        abierto
        (en el caso de las semiautomáticas) y sin munición ni casquillos o vainas en su interior y con el seguro
        accionado.<br /> <br /> ·<span> </span>Aspectos negativos:<br /> <br /> No ejecutar todos los actos precisos
        para retirar del
        arma el o los casquillos utilizados en el disparo.<br /> <br /> Agotar el tiempo asignado para esta
        acción.<br /> <br /> No
        dejar el arma lista para ser cargada de nuevo.<br /> <br /> Galería de imágenes explicativas:<br /> <br /> 01,
        02 y 03.
        Montando el arma: </p>
      <p><br /> <br /> <img src="./assets/img/img58.jpg" /> </p>
      <p><img src="./assets/img/img59.jpg" /></p>
      <p><img src="./assets/img/img5A.jpg" /><br /> </p>
      <p>04. Instalando el guardamanos: </p>
      <p><img src="./assets/img/img5B.jpg" /></p>
      <p><br /> <br /> 05. Ajustando el guardamanos: </p>
      <p><img src="./assets/img/img5C.jpg" /></p>
      <p>06. Abriendo el arma para cargarlo: </p>
      <p><img src="./assets/img/img5D.jpg" /></p>
      <p><span> </span><br /> <br /> 07. Cargando Cartuchos: </p>
      <p><img src="./assets/img/img5E.jpg" /></p>
      <p><br /> 08. Cerramos el arma mirando al suelo y en dirección a la diana. Lo mantenemos con el seguro accionado:
      </p>
      <p><img src="./assets/img/img5F.jpg" /></p>
      <p>09, 10 y 11. Apuntando: </p>
      <p><img src="./assets/img/img60.jpg" /><img src="./assets/img/img61.jpg" /><img src="./assets/img/img62.jpg" />
      </p>
      <p>12. Disparando. Una vez encarados quitamos el seguro y realizamos el disparo: </p>
      <p><img src="./assets/img/img63.jpg" /></p>
      <p><br /> 13. Descargando el arma. Podemos poner la mano para que las vainas no den a algún compañero si la
        escopeta es
        expulsora: </p>
      <p><img src="./assets/img/img64.jpg" /></p>
      <p><span> </span>14. Cargando rifle de cerrojo. Abrimos el cerrojo y empujamos la bala hacia abajo:</p>
      <p><img src="./assets/img/img65.jpg" /> </p>
      <p>15. Vamos cerrando el cerrojo y vemos como el cabezal empuja la bala hacia la recámara:</p>
      <p><img src="./assets/img/img66.jpg" /> </p>
      <p><span> </span><br /> 16. Cerrojo cerrado con seguro activado: </p>
      <p><img src="./assets/img/img67.jpg" /></p>
      <p>17. Cerrojo cerrado con seguro en posición de disparar. esto no lo realizaremos hasta que estemos apuntando y
        siempre
        cunado nos den la señal: </p>
      <p><img src="./assets/img/img68.jpg" /></p>
      <p>18. Cuidado. No poner el dedo en el disparador hasta que nos den la orden, una vez apuntando, de que realicemos
        el
        disparo. Puede ser motivo de suspender el examen práctico: </p>
      <p><img src="./assets/img/img69.jpg" /></p>
      <p>19. Apuntando con rifle de cerrojo: </p>
      <p><img src="./assets/img/img6A.jpg" /></p>
      <p>20. Apuntando con rifle de cerrojo: </p>
      <p><img src="./assets/img/img6B.jpg" /></p>
      <p>21. Abriendo el carro en rifle semiautomático para cargarlo: </p>
      <p><img src="./assets/img/img6C.jpg" /></p>
      <p>22. Abriendo el carro en rifle semiautomático para cargarlo:</p>
      <p><img src="./assets/img/img6D.jpg" /> </p>
      <p>23. Introduciendo bala en la recámara de rifle semiautomático para cargarlo. Una<span> </span> vez dentro de la
        recámara y siempre con el rifle mirando al suelo, desbloquearemos el carro para que cierre: </p>
      <p><img src="./assets/img/img6E.jpg" /></p>
      <p>24. Apuntando con rifle semiautomático: </p>
      <p><img src="./assets/img/img6F.jpg" /></p>
      <p>25. Cuidado no apuntar de esta manera con el dedo en el gatillo, puede ser motivo de suspender el examen
        práctico:
      </p>
      <p><img src="./assets/img/img70.jpg" /></p>

pendiendo del fabricante."], "c": [1], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "En una escopeta semiautomática, el percutor, extractor y grapón, son piezas que componen:", "o": ["Cerrojo", "Culata", "Cajón de los mecanismos."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Qué pieza o piezas protege el guardamonte?.", "o": ["La biela y el fiador.", "El disparador.", "Es macizo."], "c": [1], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Qué misión tiene el muelle del cargador de un rifle?", "o": ["Mantener presión en los cartuchos.", "Expulsar la vaina cuando se produce el disparo", "Elevar el cartucho y colocarlo frente a la recámara."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "En un arma semiautomática, ¿qué pieza introduce el cartucho en el interior de la recámara?.", "o": ["El cierre.", "El muelle elevador.", "La biela."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "En escopetas superpuestas, ¿qué misión tiene la banda intermedia ventilada, existente entre los cañones?.", "o": ["Refrigerar los cañones.", "Amortiguar el efecto de los vientos laterales.", "Las dos anteriores."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Qué mecanismo se encuentra en el interior del cerrojo de un rifle?.", "o": ["Mecanismo de percusión.", "Mecanismo de disparo.", "Mecanismo de expulsión."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿De qué partes se compone el mecanismo de percusión?", "o": ["Percutor y muelle del percutor.", "Percutor y cabeza del cierre.", "Cabeza y punta del percutor."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "En un rifle, ¿qué pieza arrastra el cartucho hacia la recámara?.", "o": ["El cerrojo.", "El elevador.", "El percutor."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "Para la expulsión del cartucho, ¿qué pieza engarza el culote del cartucho cuándo está alojado en la recámara?.", "o": ["Cerrojo.", "Tope de cerrojo.", "Uña extractora."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "En un rifle, ¿qué pieza expulsa la vaina del cartucho de la recámara?.", "o": ["No hay pieza, es la propia mano del tirador.", "El muelle de recuperación.", "El extractor."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "El choke de una escopeta consiste en:", "o": ["El estriado de la boca de fuego.", "Reducción de la boca de recámara.", "Estrangulamiento de la boca de fuego."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "El choke en el rifle semiautomático consiste:", "o": ["El estriado de la boca de fuego.", "Reducción de la boca de fuego.", "Carecen de choke."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿A qué se denominan extractores en una escopeta superpuesta?:", "o": ["Dos uñas que sirven para desalojar los cartuchos de su recámara", "A sendas bielas que conectan el disparador con las agujas percutoras.", "Dos muelles planos de acción helicoidal."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "En un arma larga rayada, ¿qué forma tiene la recámara?", "o": ["La del proyectil.", "La de la vaina.", "La del cartucho."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "En las armas largas rayadas de caza mayor, ¿cómo es la percusión?", "o": ["Percusión central", "Percusión adelantada.", "Sistema “Flobert”."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Qué dispositivo bloquea el funcionamiento del mecanismo de disparo a voluntad del tirador?", "o": ["Elementos de Puntería", "Nada", "Seguro manual."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Cómo se denomina el extremo del cañón de una escopeta opuesto a la parte en que se aloja el cartucho?", "o": ["Boca", "Cámara", "Recámara"], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Cuando decimos que una arma esta montada?.", "o": ["Cuando esta preparada para hacer fuego.", "Que está totalmente ensamblada.", "Ser portada por el tirador."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "Arma alimentada es aquella que:", "o": ["Tiene la munición alojada en el mecanismo de alimentación.", "Ya ha efectuado el disparo.", "No tiene munición en el mecanismo de alimentación."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "Arma montada es aquella que:", "o": ["El mecanismo de disparo y percusión se encuentra en disposición de funcionamiento.", "Está ensamblada y pavonada.", "Está ensamblada pero no pavonada.."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Dónde se aloja el cartucho de un arma para ser disparado?.", "o": ["En el cargador.", "En la recámara.", "En la canana."], "c": [1], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Por dónde expulsa una escopeta semiautomática el cartucho disparado.?", "o": ["Por la ventana trasera del arma.", "Por la ventana de ventilación.", "Por la ventana de expulsión."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "Para alimentar una escopeta semiautomática debemos:", "o": ["Introducir los cartuchos en la recámara.", "Colocar los cartuchos en el depósito.", "Montar el arma."], "c": [1], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿ Qué diferencia existe entre cargar y alimentar un arma.?", "o": ["Cargar es montarla para disparar, alimentarla introducir cartuchos en el depósito", "Cargar es introducir cartuchos en el depósito, alimentarla es montarla para disparar.", "No existe diferencia."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Puede darse el caso de que además de los extractores, las escopetas superpuestas dispongan de expulsores?", "o": ["Todas", "Ninguna", "Algunos modelos."], "c": [2], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Con qué elementos cuenta un arma para enfilarla hacia un blanco?.", "o": ["A través del mecanismo de puntería.", "Con un buen empuñamiento.", "Con una buena sujeción del arma."], "c": [0], "s": "FUNCIONAMIENTO DE LAS ARMAS" }, { "t": "¿Qué elemento del arma regula el desplazamiento en altura de un impacto?.", "o": ["El alza.", "El pun iencia de cualquier otro objeto, es:", "o": ["Un arma prohibida.", "Un arma prohibida a particulares.", "Un arma reglamentada."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "De las armas blancas que se detallan, ¿cuáles están prohibidas?", "o": ["Los puñales.", "Los machetes del Ejercito para desollar la caza.", "Las dos anteriores"], "c": [2], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "¿Se pueden utilizar miras telescópicas en las armas de la categoría 2ª.2?", "o": ["Sí.", "No.", "Está prohibido."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "¿Se pueden utilizar miras telescópicas en las armas de la categoría 3ª.2?", "o": ["Sí.", "No.", "Está prohibido."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "Un arma larga que contenga un dispositivo especial, en su culata, para una pistola legalizada, es:", "o": ["Un arma prohibida.", "Un arma combinada.", "Un arma reglamentada."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "De las armas blancas que se detallan, cuáles están prohibidas:", "o": ["Los puñales.", "Navajas de hoja inferior a 11 centímetros.", "Espadas."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "Un cuchillo de monte, de dos filos, puntiagudo y con una hoja de 20 centímetros , sería:", "o": ["Un arma de la 4ª categoría.", "Un arma blanca permitida.", "Un arma prohibida..."], "c": [1], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "De las que se relacionan, ¿cuáles son armas prohibidas?", "o": ["Navajas automáticas", "Navajas de menos de 11 centímetros de longitud de hoja.", "Cuchillos de monte de doble filo con hoja de 13 centímetros de longitud."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "Se puede poseer un rompecabezas, como instrumento auxiliar en caza mayor:", "o": ["Sí.", "Sí. Con autorización.", "No, ya que se trata de arma prohibida."], "c": [2], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "¿A qué categoría pertenece un arma de fuego larga rayada, con culata plegable?", "o": ["Es un arma prohibida.", "A la 2ª.2.", "A la 3ª.2."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "¿Cuantos silenciadores se pueden tener con un arma larga rayada para caza mayor?", "o": ["Uno para cada arma que se posea.", "Uno solo, independientemente del número de armas que se posea.", "Ninguno, está prohibido..."], "c": [2], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "Puede una persona con licencia de armas, tener y utilizar armas de fuego largas de cañones recortados.", "o": ["No; sólo está permitido a funcionarios especialmente habilitados.", "Sí. Si dispone de autorización.", "Sí. Si la utiliza solamente para cazar."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "Un arma simulada, combinada con un arma blanca, ¿es un arma prohibida?", "o": ["No.", "Sí.", "Depende del tipo de arma blanca de que se trate."], "c": [1], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "Una escopeta de caza legalmente adquirida en Francia, que posea en su culata un mecanismo para alojar otras armas, ¿puede ser legalizada en nuestro país?", "o": ["Si, con autorización francesa", "No, por ser un arma prohibida", "Si, en todos los casos"], "c": [1], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "Una escopeta de caza legalmente adquirida en Francia, que posea en su culata un mecanismo para alojar una navaja para desollar ¿puede ser legalizada en nuestro país?", "o": ["No, por ser un arma prohibida", "Si, con autorización francesa", "Si, en todos los casos.."], "c": [0], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }, { "t": "De los tipos de cartuchería que se citan, ¿cuál está prohibida a particulares?", "o": ["La munición metálica blindada.", "La cartuchería con bala expansiva.", "La cartuchería con balas perforantes, explosivas o incendiarias."], "c": [2], "s": "ARMAS SEMIAUTOMÁTICAS, ARMAS DE REPETICIÓN, ARMAS PROHIBIDAS" }], "3": [{ "t": "¿Como se denomina el documento que ampara el traslado, sin licencia ni guía de pertenencia, entre dos lugares, de armas de las categorías 2ª, 3ª y 4ª?", "o": ["Guía de circulación.", "Guía de transporte.", "Albarán de circulación."], "c": [0], "s": "CIRCULACIÓN DE ARMAS" }, { "t": "Cuando un particular adquiera una escopeta en localidad distinta a la de su residencia, ¿quién expedirá la Guía de Circulación?.", "o": ["La Intervención de Armas de su residencia", "La Intervención de Armas del lugar de la compra", "Las dos anteriores pueden ser válidas."], "c": [1], "s": "CIRCULACIÓN DE ARMAS" }, { "t": "¿Es cierto si afirmamos que no es preceptiva la guía de circulación para amparar una escopeta que su titular transportará de una localidad a otra, provisto de guía de pertenencia y licencia correspondiente?", "o": ["No en todos los casos.", "Siempre que el transporte se realice dentro de la provincia.", "Sí."], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Quién expide la Guía de circulación para transportar un arma de fuego de la 3ª categoría?", "o": ["El Comandante de Puesto de la Guardia Civil", "La Intervención de Armas y Explosivos.", "El Teniente Coronel Jefe de la Comandancia de la Guardia Civil"], "c": [1], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Por qué es necesario solicitar una guía de circulación cuando se envía a reparar una báscula de escopeta entre dos lugares distintos?", "o": ["Por ser una pieza fundamental", "No es necesario", "Está prohibido"], "c": [0], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "Cuando se envíe una escopeta sin guía de pertenencia y sin licencia, ¿qué documento amparará el traslado de una localidad a otra?", "o": ["La autorización del armero", "El permiso del Ayuntamiento", "La guía de circulación.."], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Qué armas de las que se citan a continuación, que se trasladan sin guía de pertenencia y sin licencia, necesitan guía de circulación para ser trasladadas entre dos localidades distintas?", "o": ["Las de la 3ª categoría", "Las de la 2ª categoría", "Las dos anteriores son ciertas."], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Cuándo necesitará guía de circulación una carabina de aire comprimido, que se traslade sin guía de pertenencia y sin licencia?", "o": ["En todos los casos", "Nunca", "Si se trata de una carabina cuya energía cinética del proyectil en boca exceda de 24,2 Julios"], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Qué armas de las que se citan a continuación, que se trasladan sin guía de pertenencia y sin licencia, no necesitan guía de circulación para ser trasladadas entre dos localidades?", "o": ["Las escopetas", "Las armas de fuego largas rayadas.", "Las dos anteriores son falsas."], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Qué armas de las que se citan a continuación, que se trasladan sin guía de pertenencia y sin licencia, necesitan guía de circulación para su traslado entre dos localidades distintas?", "o": ["Las escopetas", "Las armas de fuego largas rayadas.", "Las dos anteriores son ciertas..."], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "Además de la guía de circulación, ¿se necesita algún otro documento que acompañe al arma, cuando ésta se envíe a reparar a otra localidad?", "o": ["La guía de pertenencia", "Autorización escrita por el titular", "Ningún otro documento"], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Es cierto que el Reglamento de Armas contempla que las armas reglamentadas de cualquier categoría y sus piezas fundamentales acabadas circularán en envases debidamente acondicionados para su seguridad durante el traslado?", "o": ["Cierto.", "Falso.", "Depende del tipo de armas."], "c": [0], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Se pueden enviar a reparar en un mismo envase, las escopetas junto con sus municiones ?", "o": ["Sí, siempre que en el mismo paquete no haya más de 25 armas cortas", "Sí, siempre que en el mismo paquete no haya más de tres escopetas", "No"], "c": [2], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Quién precintará los envases que contengan armas largas de cañón estriado?", "o": ["El Servicio Postal de Correos", "Intervención de Armas de la Guardia Civil o Armero autorizado.", "La empresa consignataria"], "c": [1], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "¿Cómo deberán circular las armas reglamentadas de cualquier categoría y sus piezas fundamentales?", "o": ["En envases debidamente acondicionados para su seguridad durante el traslado.", "En su funda y en una caja de cartón.", "Si va desmontada, es suficiente."], "c": [0], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." }, { "t": "Si Vd. pretende enviar dos armas de su propiedad a reparar a Éibar, a dos fábricas diferentes, ¿puede hacerlo en un solo envase?", "o": ["Sí, puesto que van destinados a la misma localidad.", "No pueden remitirse en el mismo envase, al corresponder a distintos destinatarios.", "Pueden ir en uno o dos paquetes, por estar permitido."], "c": [1], "s": "CIRCULACIÓN DE ARMAS - REVISTA DE ARMAS - TRANSFERENCIAS DE ARMAS.." r revista."], "c": [2], "s": "REVISTA DE ARMAS" }, { "t": "¿En qué circunstancias se puede pasar revista de armas sin presentarla en la Intervención de Armas o Puesto de la Guardia Civil?", "o": ["En caso de enfermedad", "Cuando sea de nueva adquisición", "En ningún caso.."], "c": [2], "s": "REVISTA DE ARMAS" }, { "t": "Un cañón estriado, y con recámara para cartuchos metálicos, adaptable a una escopeta de caza, pasará revista de armas a los:", "o": ["5 años", "3 años", "No pasa revista"], "c": [0], "s": "REVISTA DE ARMAS" }, { "t": "Una carabina de repetición accionada por gas comprimido, no asimilada a escopeta, pasará revista de armas cada:", "o": ["3 años", "5 años", "No necesita pasar revista"], "c": [2], "s": "REVISTA DE ARMAS" }, { "t": "Una carabina de aire comprimido, cuyo proyectil en boca tiene una energía superior a los 24,2 julios, ¿ha de pasar revista de armas?", "o": ["Si", "No", "Sólo si se usa para cazar"], "c": [0], "s": "REVISTA DE ARMAS" }, { "t": "¿Es cierto que el particular que desee enajenar un arma tiene que hacer la cesión a persona que posea la licencia, tarjeta o certificado de inutilización correspondiente?", "o": ["Sí, siempre que sea necesario con arreglo a lo dispuesto en el Reglamento de Armas.", "Puede enajenarse a cualquiera..", "Las armas de fuego no pueden enajenarse."], "c": [0], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "Al enajenar un particular un arma de fuego, ¿dónde entregará la guía de pertenencia?", "o": ["Al adquirente.", "En la Intervención de Armas.", "En el Ayuntamiento."], "c": [1], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "¿Debe comunicarse a la Intervención de Armas la enajenación de un arma?", "o": ["Siempre", "Nunca", "Únicamente las armas cortas"], "c": [0], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "¿En qué caso no es necesario participar a la Intervención de Armas la enajenación de un arma?", "o": ["Se participa siempre.", "Cuando se enajena a una armería.", "Cuando se regala a alguien, sin mediar precio."], "c": [0], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "¿Qué requisito es indispensable que tenga el comprador de un arma de fuego?", "o": ["Que se halle en posesión de la licencia para el arma que pretende adquirir.", "Que tenga licencia de caza y seguro del cazador.", "No es necesario requisito alguno..."], "c": [0], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "La enajenación de un arma entre particulares, ¿qué nuevo documento le será expedido al comprador?", "o": ["Recibo de compra-venta.", "Entrega del arma al nuevo titular con su guía de pertenencia..", "Expedición de nueva guía de pertenencia"], "c": [2], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "La venta de un arma de fuego se efectuará siempre con conocimiento de:", "o": ["Comisaría de Policía", "Dirección General de la Guardia Civil.", "Intervención de Armas correspondiente"], "c": [2], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "¿Es cierto que los extranjeros residentes en España podrían prestar sus armas de caza a quienes estén provistos de licencia de caza y de licencia de arma larga rayada para caza mayor o escopetas?", "o": ["Cierto.", "Solo las escopetas.", "Los extranjeros residentes no pueden prestar sus armas."], "c": [0], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "¿Qué requisitos debe cumplir una persona para que se le pueda ceder el arma?", "o": ["Ser propietario de un coto de caza", "Poseer la correspondiente licencia de armas", "Tener aficiones cinegéticas"], "c": [1], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "¿Por cuánto tiempo se puede prestar las armas para cazar ?", "o": ["Mientras sea titular de un coto de caza.", "Un mes", "Quince días como máximo"], "c": [2], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "¿Cómo se debe hacer la cesión temporal de las armas ?", "o": ["Por escrito, fechado y firmado.", "De palabra", "Por teléfono"], "c": [0], "s": "TRANSFERENCIAS DE ARMAS" }, { "t": "Un español, ¿a quién podrá prestar su escopeta?", "o": ["A quien tenga licencia de caza.", "No puede prestarla.", "A quienes
